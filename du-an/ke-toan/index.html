<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kế toán nội bộ – Bản demo</title>
<style>
:root{--blue:#17306b;--blue2:#1f4196;--blue3:#e8eefc;--gold:#b8860b;--gold2:#fff4d6;--ink:#1b2236;--mut:#68718c;--line:#d5dbe8;--bg:#f3f5fa;--card:#fff;--sel:#fff1b8;--bad:#d42a2a;--ok:#13895a;--warn:#c76b00}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI",Tahoma,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:3px;padding:3px 5px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #8fb0ff;outline-offset:-1px;border-color:#5a7fe0}
input[readonly],input:disabled,select:disabled,textarea[readonly]{background:#f2f4f8;color:#4a5370}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:3px;padding:3px 9px}
button:hover:not(:disabled){background:var(--blue3);border-color:#9fb3e6}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--blue2);color:#fff;border-color:var(--blue2)}button.pri:hover:not(:disabled){background:var(--blue)}
button.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
a{color:var(--blue2);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
#shell{display:flex;flex-direction:column;height:100vh}
/* menu */
#menubar{display:flex;align-items:center;gap:2px;background:var(--blue);color:#fff;height:30px;padding:0 6px;flex:none;position:relative;z-index:50}
#menubar .brand{display:flex;align-items:center;gap:6px;font-weight:600;margin-right:10px;color:#ffe7a3}
#menubar .brand img{width:22px;height:22px}
.mnu{position:relative}
.mnu>span{display:block;padding:5px 10px;border-radius:3px;cursor:default}
.mnu:hover>span,.mnu.open>span{background:rgba(255,255,255,.14)}
.drop{display:none;position:absolute;left:0;top:100%;background:#fff;color:var(--ink);min-width:240px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px 0;border-radius:0 0 4px 4px}
.mnu.open>.drop{display:block}
.drop div.it{padding:5px 14px;cursor:pointer;white-space:nowrap;position:relative;display:flex;justify-content:space-between;gap:20px}
.drop div.it:hover{background:var(--blue3)}
.drop div.it kbd{color:var(--mut);font:11px inherit}
.drop hr{border:0;border-top:1px solid var(--line);margin:3px 0}
.drop .sub>.drop{left:100%;top:-4px;border-radius:4px}
.drop .sub:hover>.drop{display:block}
.drop .sub>.it::after{content:"›";color:var(--mut)}
#gsearch{margin-left:auto;width:280px;position:relative}
#gsearch input{width:100%;border:0;border-radius:3px;padding:4px 8px}
#gres{position:absolute;right:0;top:100%;width:380px;max-height:60vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18);display:none}
#gres div{padding:5px 10px;cursor:pointer}#gres div:hover,#gres div.hi{background:var(--blue3)}#gres small{color:var(--mut)}
#quickbar{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;background:#fff;border-bottom:1px solid var(--line);flex:none}
#quickbar .wd{margin-left:auto;display:flex;align-items:center;gap:6px}
#quickbar .wd b{color:var(--gold);cursor:pointer;border-bottom:1px dashed var(--gold)}
/* main 3 cols */
#main{flex:1;display:flex;min-height:0}
#col1{width:172px;background:var(--blue);color:#dfe6ff;flex:none;display:flex;flex-direction:column;overflow:auto;transition:width .15s}
#col1 .m{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;border-left:3px solid transparent;white-space:nowrap}
#col1 .m:hover{background:rgba(255,255,255,.08)}
#col1 .m.act{background:rgba(184,134,11,.95);color:#fff;border-left-color:#ffe7a3}
#col1 .m svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
#col1 .tog{margin-top:auto;padding:8px 12px;cursor:pointer;color:#9fb0dd;font-size:12px}
body.c1 #col1{width:46px}body.c1 #col1 .m span,body.c1 #col1 .tog span{display:none}
#col2{width:206px;background:#f8f9fd;border-right:1px solid var(--line);flex:none;overflow:auto;padding:8px 0}
#col2 h4{margin:4px 14px 8px;color:var(--blue);font-size:13px;display:flex;justify-content:space-between}
#col2 .q{display:flex;align-items:center;gap:7px;padding:6px 14px;cursor:pointer;color:var(--blue2)}
#col2 .q:hover{background:var(--blue3)}
#col2 .q::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
body.c2 #col2{display:none}
#col3{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
#tabs{display:flex;gap:0;border-bottom:1px solid var(--line);flex:none;background:#fafbfe;padding:0 6px}
#tabs .t{padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
#tabs .t.act{color:var(--blue);border-bottom-color:var(--gold);font-weight:600;background:#fff}
#tabs .sp{margin-left:auto;align-self:center;display:flex;gap:4px}
#body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
#status{display:flex;gap:16px;height:24px;align-items:center;padding:0 10px;background:var(--blue);color:#cfd8f5;font-size:12px;flex:none}
#status b{color:#fff;font-weight:600}#status .sv{margin-left:auto}
#status .err{color:#ffb4b4;font-weight:700}
/* toolbar & filters */
.tb{display:flex;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fff}
.tb .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tb button{display:flex;align-items:center;gap:4px}
.flt{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fbfcff}
.flt label{display:flex;align-items:center;gap:4px;color:var(--mut)}
/* grid */
.gw{overflow:auto;position:relative;background:#fff}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.g th{position:sticky;top:0;background:#eef2fa;color:#2a3558;font-weight:600;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);border-right:1px solid #e3e8f2;white-space:nowrap;z-index:2}
table.g tr.fr th{top:27px;padding:2px 3px;background:#f6f8fd;z-index:2}
table.g tr.fr input{width:100%;padding:1px 4px;font-size:12px;border-color:#e0e5ef}
table.g td{padding:4px 6px;border-bottom:1px solid #edf0f6;border-right:1px solid #f1f3f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
table.g td.wrap{white-space:normal}
table.g tbody tr:hover{background:#f5f8ff}
table.g tbody tr.sel{background:var(--sel)}
table.g tbody tr.draft td{color:#5d6788;font-style:italic}
table.g tbody tr.void td{color:#aab;text-decoration:line-through}
table.g tfoot td{position:sticky;bottom:0;background:#eef2fa;font-weight:600;border-top:1px solid var(--line)}
table.g tr.grp td{background:#f4f6fb;font-weight:600}
table.g tr.sum td{font-weight:700;background:#fbf6e6}
.n{text-align:right;font-variant-numeric:tabular-nums}.neg{color:var(--bad)}
.badge{display:inline-block;padding:0 6px;border-radius:8px;font-size:11px;font-style:normal}
.b-post{background:#dff5ea;color:#0c6b44}.b-draft{background:#eef0f6;color:#59617d}.b-void{background:#fde3e3;color:#a61d1d}.b-off{background:#fff0d6;color:#8a5a00}
.splitter{height:6px;background:#eef1f7;cursor:row-resize;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
.empty{color:var(--mut);text-align:center;padding:28px}
.hint{margin:auto;color:var(--mut);text-align:center;padding:30px;max-width:520px}
/* windows */
#wins{position:fixed;inset:0;pointer-events:none;z-index:100}
.mask{position:fixed;inset:0;background:rgba(15,25,55,.25);pointer-events:auto}
.win{position:absolute;background:#fff;border:1px solid #9fb0d8;box-shadow:0 12px 40px rgba(10,20,60,.35);border-radius:5px;display:flex;flex-direction:column;pointer-events:auto;max-width:100vw;max-height:100vh;min-width:320px;min-height:140px;resize:both;overflow:hidden}
.win.max{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0}
.wh{display:flex;align-items:center;gap:8px;background:linear-gradient(#244aa6,#1b3a86);color:#fff;padding:6px 8px;cursor:move;user-select:none;flex:none}
.wh .tt{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh button{background:transparent;border:0;color:#fff;padding:0 6px;font-size:15px;line-height:20px}
.wh button:hover{background:rgba(255,255,255,.18)!important}
.wb{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.wf{display:flex;gap:6px;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--line);background:#fafbfe;flex:none;align-items:center}
.wf .l{margin-right:auto;color:var(--mut)}
.frm{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;padding:12px;align-items:center}
.frm label{color:var(--mut)}
.frm .full{grid-column:1/-1}
/* voucher */
.vt{font-size:20px;font-weight:600;color:var(--blue);padding:8px 12px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vt select{font-size:13px;font-weight:400}
.vt .st{font-size:12px}
.vh{display:grid;grid-template-columns:1fr 300px;gap:10px;padding:8px 12px}
.box{border:1px solid var(--line);border-radius:4px;padding:8px 10px 10px;position:relative}
.box>.bt{position:absolute;top:-9px;left:8px;background:#fff;padding:0 5px;color:var(--blue);font-weight:600;font-size:12px}
.box .rw{display:flex;gap:6px;align-items:center;margin-top:5px}
.box .rw>label{width:96px;color:var(--mut);flex:none}
.box .rw>input,.box .rw>select{flex:1}
.stabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.stabs .t{padding:5px 12px;cursor:pointer;border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0;color:var(--mut)}
.stabs .t.act{border-color:var(--line);background:#fff;color:var(--blue);font-weight:600;margin-bottom:-1px}
table.ln{border-collapse:collapse;width:100%}
table.ln th{background:#eef2fa;padding:4px;font-weight:600;border:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
table.ln td{border:1px solid #e3e8f1;padding:0}
table.ln td input,table.ln td select{width:100%;border:0;border-radius:0;padding:4px 5px;background:transparent}
table.ln td input:focus{background:#fffbe8}
table.ln td.ix{text-align:center;color:var(--mut);width:28px;background:#f8f9fc}
table.ln tr.add td{color:var(--mut);font-style:italic;padding:5px;cursor:pointer;background:#fcfdff}
table.ln td.bad input{background:#ffecec}
.vfoot{display:flex;gap:18px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--line);background:#fafbfe;flex:none;flex-wrap:wrap}
.vfoot div{display:flex;gap:6px}.vfoot b{min-width:110px;text-align:right}
.warnbar{background:#fff1f1;color:var(--bad);padding:6px 12px;border-top:1px solid #f5c2c2;font-weight:600}
.okbar{background:#eefaf3;color:var(--ok);padding:6px 12px}
.infobar{background:#fff8e6;color:#7a5200;padding:6px 12px;border-bottom:1px solid #f1e0b0}
/* dashboard */
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:12px}
.card{border:1px solid var(--line);border-radius:6px;background:#fff;display:flex;flex-direction:column;min-height:120px}
.card.w2{grid-column:span 2}
.card h5{margin:0;padding:8px 10px;font-size:13px;color:var(--blue);border-bottom:1px solid #eef1f7;display:flex;justify-content:space-between;align-items:center}
.card h5 button{border:0;padding:0 4px;color:var(--mut)}
.card .cb{padding:10px;flex:1;display:flex;flex-direction:column;justify-content:center}
.kpi{font-size:24px;font-weight:600;color:var(--ink)}.kpi small{font-size:12px;color:var(--mut);font-weight:400}
.kv{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed #eef0f5}
.bar{height:8px;background:#e8edf9;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue2)}
/* bàn làm việc */
.hd{padding:14px;display:flex;flex-direction:column;gap:14px;font-size:13.5px}
.hrow{display:grid;gap:14px}.h4c{grid-template-columns:repeat(4,minmax(0,1fr))}.h21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.h2{grid-template-columns:repeat(2,minmax(0,1fr))}.h3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1200px){.h4c{grid-template-columns:repeat(2,minmax(0,1fr))}.h3{grid-template-columns:repeat(2,minmax(0,1fr))}.h21,.h2{grid-template-columns:minmax(0,1fr)}}
.hc{background:#fff;border:1px solid #e4e8f1;border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,30,70,.06),0 6px 18px rgba(20,30,70,.06);min-width:0}
.hc h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.hc h3 a{font-size:12px;font-weight:400}
.hero2{background:linear-gradient(135deg,var(--blue),var(--blue2) 60%,#3a66c9);color:#fff;border:0;display:flex;flex-direction:column;gap:4px}
.hero2 .big{font-size:32px;font-weight:800;letter-spacing:-.5px}.hero2 small{opacity:.88}
.hbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 2px;background:rgba(255,255,255,.15)}.hbar i{display:block;height:100%}
.hk:hover{border-color:#9fb3e6}.hk .ic{float:right;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.hk .lab{color:var(--mut);font-size:12.5px}.hk .val{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}.hk .sub{color:var(--mut);font-size:12px;margin-top:4px}
.leg2{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.leg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hl{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #e4e8f1}.hl:last-child{border-bottom:0}.hl .r{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ratio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ratio div{background:#f4f6fb;border-radius:10px;padding:8px 10px}.ratio span{font-size:12px;color:var(--mut)}.ratio b{display:block;font-size:18px;margin:2px 0}.ratio small{font-size:11px;color:var(--mut)}
.stk{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eef1f7}.stk i{display:block;height:100%}
.bb{height:6px;border-radius:3px;background:#f0f2f8;margin-top:4px;overflow:hidden}.bb i{display:block;height:100%;border-radius:3px}
.hd .pos{color:var(--ok)}.hd .warn{color:var(--warn)}
.hd .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)}.hd .dot.warn{background:var(--warn)}.hd .dot.err{background:var(--bad)}
/* flow */
.flow{display:grid;grid-template-columns:1fr 260px;gap:14px;padding:14px}
.flow .rel{border-left:1px solid var(--line);padding-left:14px}
.flow .rel a{display:block;padding:3px 0}
.fnode{cursor:pointer}.fnode rect{fill:#fff;stroke:#7d95d6;stroke-width:1.5}.fnode:hover rect{fill:#fff4d6;stroke:var(--gold)}
.fnode text{font-size:12px;fill:#1b2b5e}
/* report */
.rp{padding:16px 22px;background:#fff}
.rph{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.rpt{text-align:center;margin:8px 0 2px;font-size:17px;font-weight:700}
.rps{text-align:center;color:#333;margin-bottom:10px;font-style:italic}
table.r{border-collapse:collapse;width:100%;font-size:12px}
table.r th,table.r td{border:1px solid #b8bfd0;padding:3px 5px}
table.r th{background:#eef2fa;text-align:center}
table.r tr.grp td{background:#f2f4f9;font-weight:700}
table.r tr.sum td{font-weight:700;background:#fbf6e6}
table.r tbody tr:hover{background:#fffbe6}
table.r tr[data-vid]{cursor:pointer}

    if (p.merge) { const m = new Map(); for (const e of es) { const k = e.v.id + '|' + e.side + '|' + e.du; const g = m.get(k); if (g) { g.amt += e.amt; g.n++; } else m.set(k, { ...e, n: 1 }); } es = [...m.values()]; }

function rChiTiet(p) {

/* ---------- Kết chuyển lãi lỗ ---------- */
function closingLines(m) {
  const to = lastDay(m), B = balances({ to }), lines = [];
  // 1) Kết chuyển chi phí sản xuất 62x → 154 theo Block
  for (const a of S.accounts) {
    if (!isLeaf(a.no) || !/^62[1-7]/.test(a.no)) continue;
    for (const [proj, x] of balancesBy(no => no === a.no, 'proj', { to })) { const amt = r2(closeOf(x)); if (Math.abs(amt) > 0.5) lines.push({ desc: 'Kết chuyển ' + a.name + ' vào 154', dr: '154', cr: a.no, amt, proj, objDr: '', objCr: '', item: '' }); }
  }
  let rev = 0, exp = 0;
  for (const a of S.accounts) {
    if (!isLeaf(a.no) || !/^[5-8]/.test(a.no) || /^62[1-7]/.test(a.no)) continue;
    const cl = r2(closeOf(bal(B, a.no))); if (Math.abs(cl) < 0.5) continue;
    if (/^(511|515|711)/.test(a.no)) { lines.push({ desc: 'Kết chuyển ' + a.name, dr: a.no, cr: '911', amt: -cl, proj: '', objDr: '', objCr: '', item: '' }); rev += -cl; }
    else { lines.push({ desc: 'Kết chuyển ' + a.name, dr: '911', cr: a.no, amt: cl, proj: '', objDr: '', objCr: '', item: '' }); exp += cl; }

// Chứng từ công nợ còn mở của 1 đối tượng: phát sinh tăng (hóa đơn) trừ các lần thu/trả.
// Lần thu/trả có gắn chứng từ (l.ref) trừ đúng chứng từ đó; còn lại trừ dần chứng từ cũ nhất trước (FIFO), như "đối trừ chứng từ" của MISA.
function openItems(kind, obj, asOf, draft) {
  const acc = kind === 'thu' ? '131' : '331', inc = kind === 'thu' ? 'D' : 'C', pr = under(acc);
  const items = new Map(), linked = {}; let free = 0;
  for (const b of S.openingBalances) if (pr(b.acc) && (b.obj || '') === obj) { const n = (kind === 'thu' ? 1 : -1) * ((+b.dr || 0) - (+b.cr || 0)); if (n > 0) items.set('OB', { vid: '', no: 'Số dư đầu kỳ', date: S.startDate, inv: '', desc: 'Số dư ban đầu', amt: n }); else free += -n; }
  for (const v of S.vouchers) {
    if (!(v.status === 'posted' || (draft && v.status === 'draft')) || v.postDate > asOf) continue;
    for (const l of v.lines) {
      const a = +l.amt || 0; if (!a) continue;
      for (const side of ['D', 'C']) {
        const ac = side === 'D' ? l.dr : l.cr; if (!pr(ac) || sideObj(v, l, side) !== obj) continue;
        if (side === inc) { const it = items.get(v.id) || { vid: v.id, no: v.no, date: v.postDate, inv: v.invNo || '', desc: v.desc || l.desc, amt: 0, draft: v.status === 'draft' }; it.amt += a; items.set(v.id, it); }
        else if (l.ref) linked[l.ref] = (linked[l.ref] || 0) + a; else free += a;
      }
    }
  }
  const list = [...items.values()].sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  for (const it of list) { it.rem = r2(it.amt - (linked[it.vid] || 0)); const t = Math.min(Math.max(it.rem, 0), free); it.rem = r2(it.rem - t); free = r2(free - t); }
  return { items: list.filter(x => x.rem > 0.5), advance: free };
}

/* ---------- Kết chuyển giá vốn theo Block (Nợ 632 / Có 154 theo từng khoản mục) ---------- */
function wip154(to, draft) {
  const m = new Map();
  for (const v of S.vouchers) {
    if (!(v.status === 'posted' || (draft && v.status === 'draft')) || v.postDate > to) continue;
    for (const l of v.lines) { const a = +l.amt || 0; for (const s of ['D', 'C']) { if ((s === 'D' ? l.dr : l.cr) !== '154') continue; const k = sideKey(v, l, s, 'proj') + '|' + (l.item || ''); m.set(k, (m.get(k) || 0) + (s === 'D' ? a : -a)); } }
  }
  for (const b of S.openingBalances) if (b.acc === '154') { const k = (b.proj || '') + '|'; m.set(k, (m.get(k) || 0) + (+b.dr || 0) - (+b.cr || 0)); }
  return m;
}
function gvWin() {
  const w = openWin({ title: 'Kết chuyển giá vốn Block (Nợ 632 / Có 154)', width: 980, height: 600, body: `<div class="flt"><label>Ngày hạch toán <input data-k="date" value="${fmtD(S.workDate)}" size="10"></label><label><input type="checkbox" data-k="draft" checked> Gồm chứng từ chưa ghi sổ</label><button data-a="load">Lấy dữ liệu</button><span style="color:var(--mut)">Chi phí dở dang 154 theo Block và khoản mục. Tích Block đã nghiệm thu. Dòng "chưa gắn Block" thì chọn Block nhận.</span></div><div class="gw" style="flex:1" data-g></div>`, foot: `<span class="l" data-sum></span><button class="pri" data-a="ok">Tạo chứng từ nháp</button><button data-a="close">Đóng</button>` });
  let rows = [];
  const load = () => {
    const d = parseD($('[data-k=date]', w).value) || S.workDate, m = wip154(d, $('[data-k=draft]', w).checked);
    const rev = balancesBy(no => /^511/.test(no), 'proj', { to: d, draft: $('[data-k=draft]', w).checked });
    // Block đã kết chuyển hết (tổng = 0) thì bỏ; Block có khoản mục âm (kết chuyển cũ không ghi khoản mục) thì gộp một dòng
    const byP = new Map(); for (const [k, a] of m) { const p = k.split('|')[0]; (byP.get(p) || byP.set(p, []).get(p)).push([k, a]); }
    const flat = []; for (const [p, arr] of byP) { const tot = arr.reduce((s, x) => s + x[1], 0); if (Math.abs(tot) < 0.5) continue; if (arr.some(x => x[1] < -0.5)) flat.push([p + '|', tot]); else flat.push(...arr); }
    rows = flat.filter(([, a]) => Math.abs(a) > 0.5).map(([k, a]) => { const [proj, item] = k.split('|'); const rv = bal(rev, proj); return { proj, item, amt: r2(a), target: proj, on: !!proj && (rv.c - rv.d) > 0.5, rev: rv.c - rv.d }; }).sort((x, y) => (x.proj || 'zz').localeCompare(y.proj || 'zz'));
    draw();
  };
  const draw = () => {
    $('[data-g]', w).innerHTML = rows.length ? `<table class="g"><thead><tr><th></th><th>Block</th><th>Khoản mục</th><th>Dở dang 154</th><th>Doanh thu 5113 của Block</th><th>Kết chuyển vào Block</th></tr></thead><tbody>${rows.map((r, i) => `<tr data-i="${i}" class="${r.on ? 'sel' : ''}"><td><input type="checkbox" data-c ${r.on ? 'checked' : ''}></td><td>${r.proj ? esc(r.proj + ' · ' + projName(r.proj)) : '<i>(chưa gắn Block)</i>'}</td><td>${esc(r.item ? r.item + ' · ' + (KMCP.find(x => x[0] === r.item) || [, ''])[1] : '(chưa có khoản mục)')}</td>${numCell(r.amt)}${numCell(r.rev)}<td><select data-t>${S.projects.map(p => `<option value="${esc(p.code)}" ${p.code === r.target ? 'selected' : ''}>${esc(p.code)}</option>`).join('')}<option value="" ${!r.target ? 'selected' : ''}>(không gắn)</option></select></td></tr>`).join('')}</tbody></table>` : '<div class="empty">TK 154 không còn dư.</div>';
    $('[data-sum]', w).textContent = 'Kết chuyển: ' + fmt0(rows.filter(r => r.on).reduce((s, r) => s + r.amt, 0));
  };
  w.addEventListener('change', e => { const tr = e.target.closest('tr[data-i]'); if (tr) { const r = rows[+tr.dataset.i]; if (e.target.matches('[data-c]')) r.on = e.target.checked; if (e.target.matches('[data-t]')) r.target = e.target.value; draw(); } if (e.target.matches('[data-k=draft]')) load(); });
  w.addEventListener('click', e => {
    const a = (e.target.closest('[data-a]') || {}).dataset?.a; if (a === 'close') return w.close(); if (a === 'load') return load(); if (a !== 'ok') return;
    const sel = rows.filter(r => r.on); if (!sel.length) return msg('Tích ít nhất một dòng.');
    const v = newVoucher('giaVon'); v.date = v.postDate = parseD($('[data-k=date]', w).value) || S.workDate; v.no = nextNo('GV', v.date);
    const blocks = [...new Set(sel.map(r => r.target).filter(Boolean))]; v.desc = 'Kết chuyển giá vốn Block ' + blocks.join(', '); v.proj = blocks.length === 1 ? blocks[0] : '';
    // dòng "chưa gắn Block": ghi Có 154 không Block, Nợ 632 vào Block nhận
    v.lines = sel.map(r => ({ desc: 'Giá vốn Block ' + (r.target || '') + (r.item ? ' – ' + r.item : ''), dr: '632', cr: '154', amt: r.amt, objDr: '', objCr: '', proj: r.target, projCr: r.proj, taxRate: '', item: r.item }));
    try { saveVoucher(v, true); } catch (er) { return msg(er.message); }

  });
  load();
}

  if (out && /LUONG/.test(D)) return S1('PAY', '334', emp && emp.code, 'Thanh toán lương' + (emp ? ' ' + emp.name : ''));

document.addEventListener('dblclick', e => { const tr = e.target.closest('#ltab tbody tr[data-vid]'); if (tr) openVoucher(tr.dataset.vid); });
/* ---------- Nhân bản chứng từ: chép nội dung sang chứng từ mới (Nháp, ngày hạch toán hiện tại), mở ra để sửa rồi Cất ---------- */
function dupVoucher(src) {
  const v = JSON.parse(JSON.stringify(src));
  // bỏ mọi liên kết với chứng từ gốc: nguồn lấy dữ liệu, số gốc, đối trừ công nợ, phân bổ CCDC/khấu hao, số hóa đơn (hóa đơn không trùng)
  for (const k of ['srcKey', 'pbRefs', 'hrRefs', 'oldNo', 'allocKind', 'allocMonth', 'warn', 'created', 'updated', 'dueDate', 'invNo', 'invDate']) delete v[k];
  Object.assign(v, { id: uid(), no: '', date: S.workDate, postDate: S.workDate, status: 'draft', source: 'manual' });
  v.lines = v.lines.map(({ ref, regId, regIssue, pk, ...l }) => l);
  const w = openVoucher(v); audit('Nhân bản chứng từ', null, null, (src.no || '') + ' → chứng từ mới (chưa cất)'); return w;
}
function ctxMenu(x, y, items) {
  $$('.ctx').forEach(m => m.remove());
  const m = document.createElement('div'); m.className = 'ctx';
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<div data-i="${i}" class="${it[2] === false ? 'off' : ''}"><span>${it[0]}</span><small>${it[3] || ''}</small></div>`).join('');
  document.body.appendChild(m);
  m.style.left = Math.min(x, innerWidth - m.offsetWidth - 4) + 'px'; m.style.top = Math.min(y, innerHeight - m.offsetHeight - 4) + 'px';
  m.addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (!d) return; m.remove(); items[+d.dataset.i][1](); });
  setTimeout(() => document.addEventListener('mousedown', function off(e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('mousedown', off); } }), 0);
}
// chuột phải vào dòng chứng từ (danh sách phân hệ, Tìm chứng từ, Kiểm tra đối chiếu, báo cáo chi tiết)
document.addEventListener('contextmenu', e => {
  const tr = e.target.closest('tr[data-vid]'); if (!tr || e.target.closest('input,textarea,select')) return;
  const v = S.vouchers.find(x => x.id === tr.dataset.vid); if (!v) return;
  e.preventDefault();
  const inList = tr.closest('#ltab'); if (inList) { const L = listState(modById(UI.mod)); L.sel = v.id; $$('#ltab tr.sel').forEach(x => x.classList.remove('sel')); tr.classList.add('sel'); renderDetail(); }
  const redraw = () => { inList ? renderList() : refreshAfterChange(); };
  const tryDo = f => () => { try { f(); touch(); redraw(); } catch (er) { msg(er.message); } };
  ctxMenu(e.clientX, e.clientY, [
    ['Xem', () => openVoucher(v.id), true, 'Nháy đúp'],
    ['Sửa', () => { const w = openVoucher(v.id); w._act('edit'); }, v.status === 'draft'],
    ['Nhân bản', () => dupVoucher(v), v.status !== 'void'],
    '-',
    ['Ghi sổ', tryDo(() => postVoucher(v)), v.status === 'draft'],
    ['Bỏ ghi', tryDo(() => unpostVoucher(v)), v.status === 'posted'],
    '-',
    ['In', () => printVoucher(v), true],
    ['Xóa', async () => { if (!(await ask('Xóa chứng từ ' + v.no + '?'))) return; tryDo(() => deleteVoucher(v))(); }, v.status === 'draft']
  ]);
});
document.addEventListener('mouseover', e => { const mn = e.target.closest('.mnu'); if (mn && $('.mnu.open') && !mn.classList.contains('open')) { $$('.mnu.open').forEach(x => x.classList.remove('open')); mn.classList.add('open'); } });
document.addEventListener('input', e => {
  if (e.target.matches('[data-lf]')) { const L = listState(modById(UI.mod)); L.f[e.target.dataset.lf] = e.target.value; const k = e.target.dataset.lf, pos = e.target.selectionStart; renderList(); const i = $(`[data-lf="${k}"]`); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }
  if (e.target.id === 'rq') { UI.rq = e.target.value; const pos = e.target.selectionStart; renderBody(); const i = $('#rq'); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === 'gq') gsearch(e.target.value);
});
document.addEventListener('change', e => { if (e.target.closest('#lflt') && e.target.matches('[data-per]')) { const r = periodRange(e.target.value); if (r) { $('#lflt [data-from]').value = fmtD(r[0]); $('#lflt [data-to]').value = fmtD(r[1]); } } if (e.target.closest('#dflt') && e.target.matches('[data-per]')) { const r = periodRange(e.target.value); if (r) { $('#dflt [data-from]').value = fmtD(r[0]); $('#dflt [data-to]').value = fmtD(r[1]); } } });
document.addEventListener('mousedown', e => {
  if (e.target.id !== 'lsplit') return; e.preventDefault();
  const wrap = $('#lwrap'), g = $('#lgrid'), r = wrap.getBoundingClientRect();
  const mv = ev => { const pc = Math.min(88, Math.max(15, (ev.clientY - r.top) / r.height * 100)); g.style.flex = `0 0 ${pc}%`; listState(modById(UI.mod)).h = pc; };
  const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
  addEventListener('mousemove', mv); addEventListener('mouseup', up);
});
function gsearch(q) {
  const box = $('#gres'); q = q.trim().toLowerCase(); if (!q) { box.style.display = 'none'; return; }
  const out = [];
  const walk = (items, path) => items.forEach(it => { if (it === '-') return; if (Array.isArray(it[1])) walk(it[1], path + it[0] + ' › '); else if (it[1] && (path + it[0]).toLowerCase().includes(q)) out.push([it[0], path.replace(/ › $/, ''), it[1]]); });
  walk(MENU.filter(m => m[1]), '');
  for (const [k, t] of Object.entries(QT)) if (t.label.toLowerCase().includes(q)) out.push([t.label, 'Nghiệp vụ', 'q:' + k]);
  for (const r of REPORTS) if (r.name.toLowerCase().includes(q)) out.push([r.name, 'Báo cáo', 'rep:' + r.id]);
  for (const v of S.vouchers) if (out.length < 30 && ((v.no || '').toLowerCase().includes(q) || (v.oldNo || '').toLowerCase().includes(q) || (v.desc || '').toLowerCase().includes(q))) out.push([v.no + ' · ' + fmtD(v.postDate), v.desc, 'open:' + v.id]);
  box.innerHTML = out.slice(0, 30).map((x, i) => `<div data-g="${esc(x[2])}" class="${i ? '' : 'hi'}">${esc(x[0])}<br><small>${esc(x[1] || '')}</small></div>`).join('') || '<div><small>Không tìm thấy.</small></div>';
  box.style.display = 'block';
}
document.addEventListener('mousedown', e => { const g = e.target.closest('#gres [data-g]'); if (!g) return; e.preventDefault(); const a = g.dataset.g; $('#gres').style.display = 'none'; $('#gq').value = ''; a.startsWith('open:') ? openVoucher(a.slice(5)) : doAct(a); });
document.addEventListener('keydown', e => {
  const w = topWin();
  if (e.target.id === 'gq') {
    const items = $$('#gres [data-g]'), hi = items.findIndex(x => x.classList.contains('hi'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = Math.max(0, Math.min(items.length - 1, hi + (e.key === 'ArrowDown' ? 1 : -1))); items.forEach((x, i) => x.classList.toggle('hi', i === n)); }
    if (e.key === 'Enter' && items[hi]) { const a = items[hi].dataset.g; $('#gres').style.display = 'none'; e.target.value = ''; a.startsWith('open:') ? openVoucher(a.slice(5)) : doAct(a); }
    if (e.key === 'Escape') { $('#gres').style.display = 'none'; e.target.blur(); }
    return;
  }
  if (e.ctrlKey && (e.key === 'q' || e.key === 'Q')) { e.preventDefault(); $('#gq').focus(); return; }
  if (e.ctrlKey && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); findWin(); return; }
  if (e.key === 'Escape' && w) { e.preventDefault(); w.close(); return; }
  if (w && w.dataset.voucher && e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); w._act('save'); return; }
  if (w && w.dataset.voucher && e.ctrlKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); w._act('add'); return; }
  if (!w && e.ctrlKey && (e.key === 'n' || e.key === 'N') && UI.tab === 'list') { e.preventDefault(); ACT.lAdd(); return; }
  if (!w && UI.tab === 'list' && !e.target.matches('input,select,textarea') && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {
    const L = listState(modById(UI.mod)), trs = $$('#ltab tbody tr[data-vid]'), i = trs.findIndex(x => x.dataset.vid === L.sel);
    if (e.key === 'Enter') { if (L.sel) openVoucher(L.sel); return; }
    e.preventDefault(); const n = Math.max(0, Math.min(trs.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1))); if (!trs[n]) return;
    L.sel = trs[n].dataset.vid; trs.forEach(x => x.classList.toggle('sel', x === trs[n])); trs[n].scrollIntoView({ block: 'nearest' }); renderDetail();
  }
});
addEventListener('beforeunload', e => { if (saveState.st === 'pending' || saveState.st === 'saving') { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Khởi động ---------- */
(async function boot() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (r.status === 404) { S = newState(); rebuildAcc(); await saveNow(); }
    else if (r.ok) { S = migrate(await r.json()); }
    else throw new Error('HTTP ' + r.status);
  } catch (e) {
    document.body.innerHTML = `<div style="padding:40px;font:15px Segoe UI"><h2 style="color:#b8860b">Không kết nối được máy chủ nội bộ</h2><p>Mở ứng dụng bằng biểu tượng <b>Kế toán nội bộ MB VH</b> (hoặc chạy KeToan.bat) để máy chủ chạy tại http://localhost:8769/.</p><p style="color:#888">Chi tiết: ${esc(e.message)}</p></div>`;
    return;
  }
  rebuildAcc();
  UI.mod = S.ui.mod && MODS.some(m => m.id === S.ui.mod) ? S.ui.mod : 'dash'; UI.tab = UI.mod === 'dash' ? 'dash' : UI.mod === 'baocao' ? 'center' : 'list';
  renderMenu(); render();
  saveState = { st: 'ok', at: (S.ts || '').slice(11, 16), err: '' }; renderStatus();
  loadExt().then(renderStatus);
  hrAutoPay(); setInterval(hrAutoPay, 60000); addEventListener('focus', hrAutoPay);
})();
</script>
