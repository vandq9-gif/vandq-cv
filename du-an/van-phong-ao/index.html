.who>*{pointer-events:auto}

.bub:after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c);border-bottom:0}
.compact .bub{max-width:150px;min-width:90px;font-size:10.5px;padding:4px 6px}
.compact .bub .tx{-webkit-line-clamp:2}
.tag{border:none;background:#1C1917;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.28);font-family:inherit;cursor:pointer}
.tag.sel{background:var(--gold);color:#1C1917}
.compact .tag{font-size:10px;padding:2px 7px}

.sign .k{font-size:7px;letter-spacing:.22em;color:#C9A227;font-weight:700;line-height:1.1}
.sign .n{font-size:10px;letter-spacing:.08em;color:#FDE68A;font-weight:800;text-transform:uppercase;line-height:1.25;display:flex;align-items:center;gap:4px}
.sign .n i{width:6px;height:6px;border-radius:50%;display:inline-block}
.sign .pc{font-size:8.5px;color:#fff;background:#6D28D9;border-radius:6px;padding:0 4px;letter-spacing:0;margin-left:3px}
.sign .pole{width:2px;height:16px;background:linear-gradient(#78716C,#44403C)}
.sign .foot{width:12px;height:4px;border-radius:50%;background:#292524;opacity:.75}
.sign:hover .bd{border-color:#FDE68A}
.compact .sign .bd{padding:2px 6px}.compact .sign .n{font-size:8.5px}.compact .sign .k{display:none}.compact .sign .pole{height:10px}
@media (max-width:1300px) and (min-width:901px){.body{grid-template-columns:minmax(0,1fr) 360px}}

button,input,textarea,select{font-family:inherit;font-size:14px}
button{cursor:pointer}
.wrap{max-width:1560px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:16px}

.cmd label{font-size:13px;font-weight:700;color:#E7C766}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cmd input{flex:999 1 380px;min-width:0;height:44px;border-radius:10px;border:1px solid #44403C;background:#292524;color:#FAFAF9;padding:0 14px;font-size:15px}

.btn.red{color:#991B1B;border-color:#FCA5A5}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.main{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.mapbox{flex:999 1 760px;min-width:0;display:flex;flex-direction:column;gap:16px}
.map{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#E9EEE4}

.addpin{width:30px;height:30px;border-radius:50%;border:1.5px dashed #A8A29E;background:#fff;color:#57534E;font-weight:800;padding:0}

.ptabs{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:-12px;background:var(--bg);padding:4px 0 8px;z-index:5}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}

.chipst{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;display:inline-block}
.meta{font-size:12px;color:var(--mute)}
.res{font-size:13px;background:#F7F4EE;border-radius:8px;padding:8px 10px;white-space:pre-wrap;line-height:1.5;max-height:340px;overflow:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{height:36px;padding:0 12px;border-radius:9px;border:none;background:transparent;font-weight:700;color:var(--sub)}
.tab.on{background:#1C1917;color:#fff}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
input.t,textarea.t,select.t{border:1px solid #D6CFC2;border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);font-weight:400;width:100%}
textarea.t{min-height:80px;resize:vertical}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid #D6CFC2;background:#fff;font-weight:700;font-size:13px}
.pill.on{background:#1C1917;border-color:#1C1917;color:#fff}
.note{background:#FAF6EC;border:1px solid #EADFC4;border-radius:10px;padding:9px 11px;font-size:13px;color:var(--sub)}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dept{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;min-height:44px}
.srow:hover{background:#FAF8F4}
.srow.on{background:#F6F0E1;border-color:var(--gold)}
.srow .nm{font-weight:700;font-size:13.5px}
.srow .ag{font-size:12px;color:var(--mute)}
.bubble{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.5;font-size:13.5px}
.bubble.u{align-self:flex-end;background:#1C1917;color:#fff}
.bubble.a{align-self:flex-start;background:#F4F1EA}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.warn{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:10px;padding:10px 12px;font-size:13px}
.hide{display:none}

</style>
</head>

const QUYUOC="QUY ƯỚC VĂN PHÒNG ẢO MB VH (dùng chung cho mọi đoạn chat / phiên trong dự án này)\nKho dữ liệu: artifact slug DEMO (bản demo). Công cụ: db_query, db_get, db_write. Xưng \"em\", gọi Giám đốc là \"anh\".\n\nA. KHI ANH NHẮN \"nhận việc <tên nhân viên>\" (có thể nhiều tên, cách nhau dấu phẩy) hoặc chỉ \"nhận việc\"\n1. Xác định nhân viên: db_query collection \"staff\" where name == <tên>. Không thấy thì db_query theo role, rồi so khớp gần đúng (không phân biệt hoa thường, bỏ dấu). Ghi nhớ mã (id) nhân viên cho đoạn chat này; lần sau anh chỉ nhắn \"nhận việc\" thì dùng lại mã đã nhớ. Chưa biết mã thì hỏi anh tên nhân viên.\n2. Đọc trường \"profile\" của nhân viên đó để làm đúng vai.\n3. db_query collection \"tasks\" where staffId in [mã] và status in [\"chat\",\"giao\",\"sua\"], orderBy createdAt. Không dùng db_list, không đọc việc của người khác hay việc đã xong. Không có việc: báo \"Không có việc mới\", dừng.\n4. Với từng việc:\n   a. db_write update (ifVersion từ kết quả query): status \"lam\", history = history cũ + {at:<mili giây>, text:\"<tên> nhận việc\"}.\n   b. Làm ngay tại đây bằng lịch sử, file và công cụ của đoạn chat này. Status cũ là \"sua\" thì làm theo \"feedback\".\n   c. Xong: db_get tasks/<id> lấy version mới, rồi db_write update: result = bản GỌN (tối đa ~1.500 chữ, dòng đầu là tóm tắt), status \"duyet\", updatedAt <mili giây>, history thêm {at, text:\"Nộp kết quả\"}.\n5. Báo ngắn: đã làm việc nào, đã gửi về văn phòng chờ duyệt.\n\nB. VIỆC ANH GIAO THẲNG TRONG ĐOẠN CHAT (khi đã biết mã nhân viên, chỉ việc có kết quả rõ ràng)\ndb_write set \"tasks/chat-<mili giây>\": {staffId:<mã>, title, detail:\"Giao trong đoạn chat\", kind:\"chat\", prio:\"Thường\", due:\"\", status:\"duyet\", result:<bản gọn>, feedback:\"\", createdAt, updatedAt, history:[{at, text:\"Làm trong đoạn chat\"}]}\n\nC. LỊCH / HẠN → NHẮC LỊCH\nKhi tạo hoặc đổi lịch (lịch tập, lịch học, hạn nộp bài...): mỗi mục một tài liệu \"reminders/<mã>-<YYYYMMDD>-<HHMM>\": {staffId:<mã>, date:\"YYYY-MM-DD\", time:\"HH:MM\", text, daily:false, createdAt}. Đã có thì db_get lấy version rồi ghi đè.\n\nD. \"cập nhật sổ tay văn phòng\": tóm tắt điều quan trọng hiện tại (dưới 1.500 chữ) → db_get staff/<mã> rồi db_write update trường \"profile\".\n\nE. Luôn ghi kèm ifVersion vừa đọc. Không xoá dữ liệu. Không có công cụ thì báo rõ \"Đoạn chat này chưa có công cụ văn phòng ảo\", không bịa là đã ghi.";

const ABBR=[["BHXH","bảo hiểm xã hội"],["BHYT","bảo hiểm y tế"],["BHTN","bảo hiểm thất nghiệp"],["TNCN","thu nhập cá nhân"],["TNDN","thu nhập doanh nghiệp"],["GTGT","giá trị gia tăng"],["HĐLĐ","hợp đồng lao động"],["KPCĐ","kinh phí công đoàn"],["CCCD","căn cước công dân"],["HCNS","hành chính nhân sự"],["VNĐ","đồng"],["VND","đồng"],["HM","bán ma ra tông"],["VD","ví dụ"],["TP","thành phố"],["NV","nhân viên"],["GĐ","giám đốc"],["PGĐ","phó giám đốc"]];
const THU={"T2":"thứ Hai","T3":"thứ Ba","T4":"thứ Tư","T5":"thứ Năm","T6":"thứ Sáu","T7":"thứ Bảy","CN":"Chủ nhật"};
const DG=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function vn3(n,full){const tr=Math.floor(n/100),ch=Math.floor(n%100/10),dv=n%10;let o=[];
  if(full||tr)o.push(DG[tr]+" trăm");
  if(ch>1){o.push(DG[ch]+" mươi");if(dv===1)o.push("mốt");else if(dv===4)o.push("tư");else if(dv===5)o.push("lăm");else if(dv)o.push(DG[dv])}
  else if(ch===1){o.push("mười");if(dv===5)o.push("lăm");else if(dv)o.push(DG[dv])}
  else if(dv){if(full||tr)o.push("linh");o.push(DG[dv])}
  return o.join(" ")}
function vnNum(n){n=Math.floor(+n);if(!isFinite(n))return String(n);if(n===0)return"không";const U=["","nghìn","triệu","tỷ"];let parts=[],i=0;
  while(n>0&&i<4){parts.unshift([n%1000,i]);n=Math.floor(n/1000);i++}
  return parts.map((g,k)=>g[0]===0?"":vn3(g[0],k>0)+(U[g[1]]?" "+U[g[1]]:"")).filter(Boolean).join(" ").replace(/\s+/g," ").trim()}
function cleanSpeech(t){let x=String(t||"").split("\n").filter(l=>!/^\s*(Link|Nguồn)\s*:/i.test(l)).join("\n");
  x=x.replace(/(\d)\s*[–-]\s*(\d)/g,"$1 đến $2");
  x=x.replace(/\[cần bổ sung:[^\]]*\]/gi,". Phần này cần bổ sung thông tin. ").replace(/https?:\/\/\S+/g," ");
  ABBR.forEach(([k,v])=>{x=x.replace(new RegExp("(^|[^\\p{L}])"+k+"(?=[^\\p{L}]|$)","gu"),"$1"+v)});
  x=x.replace(/\b(T[2-7]|CN)(?=[\s,.:·]|$)/g,m=>THU[m]);
  x=x.replace(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g,(m,d,mo,y)=>"ngày "+(+d)+" tháng "+(+mo)+" năm "+y);
  x=x.replace(/\b(\d{1,2})\/(\d{4})\b/g,(m,mo,y)=>"tháng "+(+mo)+" năm "+y);
  x=x.replace(/\b(\d{1,2})\/(\d{1,2})\b(?!\s*km)/g,(m,d,mo)=>(+mo<=12?"ngày "+(+d)+" tháng "+(+mo):m));
  x=x.replace(/\b(\d{1,2}):(\d{2}):(\d{2})\b/g,(m,h,mi,se)=>h+" giờ "+(+mi)+" phút "+(+se)+" giây");
  x=x.replace(/\b(\d{1,2}):(\d{2})\s*(?:đến\s*(\d{1,2}):(\d{2}))?\s*\/\s*km\b/gi,(m,a,b,c,d)=>a+" phút "+(+b)+(c?" đến "+c+" phút "+(+d):"")+" mỗi ki lô mét");
  x=x.replace(/(pace|tempo|tốc độ)([^.\n]{0,12}?)\b(\d{1,2}):(\d{2})\b/gi,(m,w,mid,a,b)=>w+mid+a+" phút "+(+b));
  x=x.replace(/\b(\d{1,2}):(\d{2})\b/g,(m,h,mi)=>(+h<24?h+" giờ"+(+mi?" "+(+mi)+" phút":""):m));
  x=x.replace(/(\d)\.(?=\d{3}\b)/g,"$1").replace(/(\d),(\d)/g,"$1 phẩy $2").replace(/(\d)\s*(đ|₫)(?![\p{L}])/gu,"$1 đồng").replace(/\d{4,}/g,m=>m.length>12?m:vnNum(m));
  x=x.replace(/(\d)\s*(đ|₫)(?![\p{L}])/gu,"$1 đồng").replace(/(\d)\s*tr\b/g,"$1 triệu");
  x=x.replace(/(\d)\s*[–-]\s*(\d)/g,"$1 đến $2").replace(/≤/g," không quá ").replace(/≥/g," ít nhất ").replace(/~/g," khoảng ").replace(/%/g," phần trăm")
   .replace(/(\d)\s*x\s*(\d)/gi,"$1 nhân $2").replace(/(\d)\s*km\b/gi,"$1 ki lô mét").replace(/\/\s*km\b/gi," mỗi ki lô mét").replace(/(\d)\s*kg\b/gi,"$1 ki lô gam").replace(/(\d)\s*m(?![\p{L}\d])/gu,"$1 mét");
  x=x.replace(/→|=>/g,", rồi ").replace(/[#*_`>|\[\]{}"“”]/g," ").replace(/[()]/g,", ").replace(/[–—]/g,", ").replace(/:\s/g,", ").replace(/\b(ngày|tháng)\s+\1\b/gu,"$1").replace(/(ngày|tháng) (ngày|tháng)/g,"$2");
  x=x.split("\n").map(l=>l.replace(/^\s*[-•]\s*/,"").replace(/^\s*(\d+)[.)]\s+/,"Ý $1. ").trim()).filter(Boolean).map(l=>/[.!?…:]$/.test(l)?l:l+".").join("\n");
  return x.replace(/[ \t]+/g," ").replace(/ ([,.])/g,"$1").replace(/,\s*,/g,",").replace(/\.\s*\./g,".").trim()}
function chunks(t){const out=[];String(t).split(/\n+/).forEach(p=>{p=p.trim();if(!p)return;while(p.length>260){let i=p.lastIndexOf(". ",260);if(i<80)i=p.lastIndexOf(", ",260);if(i<80)i=260;out.push({t:p.slice(0,i+1),gap:40});p=p.slice(i+1).trim()}if(p)out.push({t:p,gap:140})});return out}
function stopSpeak(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}S.speaking=null;render()}
function browserSpeak(text){return new Promise(res=>{try{const ss=window.speechSynthesis;ss.cancel();
  const parts=chunks(text);let i=0;const next=()=>{if(i>=parts.length||!S.speaking){res();return}const c=parts[i++];const u=new SpeechSynthesisUtterance(c.t);u.lang="vi-VN";u.voice=VI;u.rate=1;u.pitch=1;u.onend=()=>setTimeout(next,c.gap);u.onerror=()=>res();ss.speak(u)};next()}catch(e){res()}})}
async function speak(text,key){
  if(S.speaking===key){stopSpeak();return}
  stopSpeak();await loadVi();
  if(!VI){S.noVi=true;render();return}
  S.noVi=false;S.speaking=key;render();
  await browserSpeak(cleanSpeech(text));
  if(S.speaking===key){S.speaking=null;render()}}

async function act(a,ds){ds=ds||{};
  if(a!=="deltask"&&a!=="delStaff")S.delArm=null;
  const s=staffById(S.sel);
  switch(a){
  case "pick":S.resetScroll=true;S.renaming=null;S.showQuy=null;S.sel=ds.id;loadChat(ds.id);S.editing=null;S.tab="viec";S.who=null;break;
  case "who":S.who=ds.id;break;
  case "rename":S.renaming=S.sel;S.drafts["name_"+S.sel]=(s&&s.name)||"";break;
  case "cancelName":S.renaming=null;break;
  case "saveName":{const nm=(S.drafts["name_"+S.sel]||"").trim().slice(0,40);try{await db.doc("staff/"+S.sel).update({name:nm,updatedAt:Date.now()});S.renaming=null}catch(er){setWarn("Không đổi được tên: "+(er.message||er.code))}break}
  case "copyQuy":try{await navigator.clipboard.writeText(QUYUOC);S.showQuy=null;setWarn("Đã chép Quy ước chung. Dán vào Instructions của dự án.")}catch(er){S.showQuy=QUYUOC}break;
  case "copyCmd":try{await navigator.clipboard.writeText(ds.id);S.showQuy=null;setWarn("Đã chép: "+ds.id)}catch(er){S.showQuy=ds.id}break;
  case "closeNoVi":S.noVi=false;break;
  case "speak":speak(speakText(ds.id),ds.id);return;
  case "renDept":{const d=dept(ds.id);S.deptRen=ds.id;S.drafts["dn_"+ds.id]=d.name;S.drafts["dp_"+ds.id]=d.project;break}
  case "cancelDept":S.deptRen=null;break;
  case "saveDept":{const nm=(S.drafts["dn_"+ds.id]||"").trim().slice(0,50),pj=(S.drafts["dp_"+ds.id]||"").trim().slice(0,60);if(!nm){setWarn("Cần nhập tên phòng.");return}
    try{await db.doc("depts/"+ds.id).set({name:nm,project:pj,updatedAt:Date.now()});const o=dept(ds.id);o.name=nm;o.project=pj;S.deptRen=null}catch(er){setWarn("Không lưu được: "+(er.message||er.code))}break}
  case "toggleRep":S.openRep=(S.openRep===ds.id)?"__none":ds.id;break;
  case "readRep":try{const r=S.reports.find(x=>x.id===ds.id);await db.doc("reports/"+ds.id).update({read:true})}catch(er){setWarn("Không lưu được: "+(er.message||er.code))}break;
  case "openNews":S.resetScroll=true;S.sel=null;S.editing=null;S.view="tin";S.openRep=ds.id;break;
  case "home":S.sel=null;S.view="tong";break;
  case "dept":S.resetScroll=true;S.sel=null;S.editing=null;S.view="ns";break;
  case "view":S.resetScroll=true;if(ds.id==="tong"||ds.id==="ns"||ds.id==="tin"){S.sel=null;S.editing=null;S.view=ds.id}break;
  case "tab":S.tab=ds.id;break;
  case "kind":S.kind=ds.id;break;
  case "prio":S.prio=ds.id;break;
  case "add":S.editing={dept:ds.dept||"bld",linkType:"Chat",software:"",role:"",link:"",profile:"",hint:"",proactive:{on:false,time:"07:00",desc:""}};break;
  case "edit":{const x=staffById(ds.id);S.editing=JSON.parse(JSON.stringify(x));break}
  case "cancelEdit":S.editing=null;break;
  case "saveStaff":return saveStaff();
  case "delStaff":{const e=S.editing;if(S.delArm!=="s"+e.id){S.delArm="s"+e.id;break}S.delArm=null;try{await db.doc("staff/"+e.id).delete();S.editing=null;S.sel=null}catch(er){setWarn("Không xoá được: "+er.message)}break}
  case "assign":case "assigntake":return assign(a==="assigntake");
  case "take":return take(ds.id);
  case "ok":{const t=S.tasks.find(x=>x.id===ds.id);await upd(ds.id,{status:"xong",history:hist(t,"Giám đốc duyệt")});return}
  case "fb":S.fbOpen=ds.id;break;
  case "fbcancel":S.fbOpen=null;break;
  case "fbsend":{const t=S.tasks.find(x=>x.id===ds.id);const fb=(S.drafts["fb_"+ds.id]||"").trim();if(!fb)return;S.fbOpen=null;S.drafts["fb_"+ds.id]="";await upd(ds.id,{status:"sua",feedback:fb,history:hist(t,"Yêu cầu sửa: "+fb)});return}
  case "submit":S.fbOpen="sub"+ds.id;break;
  case "subsend":{const t=S.tasks.find(x=>x.id===ds.id);const r=(S.drafts["sub_"+ds.id]||"").trim();if(!r)return;S.fbOpen=null;S.drafts["sub_"+ds.id]="";await upd(ds.id,{status:"duyet",result:r,history:hist(t,"Nộp kết quả thủ công")});return}
  case "copy":{const t=S.tasks.find(x=>x.id===ds.id);const st=staffById(t.staffId)||{};const txt="[Việc từ Văn phòng ảo · mã "+t.id+"]\nGiao cho: "+(st.role||"")+"\nViệc: "+t.title+(t.detail?"\nChi tiết: "+t.detail:"")+"\nHạn: "+fmtD(t.due)+" · Ưu tiên: "+(t.prio||"Thường")+(t.feedback?"\nYêu cầu sửa: "+t.feedback:"");try{await navigator.clipboard.writeText(txt);setWarn("")}catch(er){setWarn("Trình duyệt không cho chép tự động. Hãy bôi đen nội dung việc để chép.")}return}
  case "deltask":{if(S.delArm!=="t"+ds.id){S.delArm="t"+ds.id;break}S.delArm=null;try{await db.doc("tasks/"+ds.id).delete()}catch(er){setWarn(er.message)}return}
  case "ask":return ask();
  case "clearchat":S.chats[S.sel]=[];saveChat(S.sel);break;
  case "remember":remember();return;
  case "editNb":S.editNb=true;S.drafts.notebook=S.notebook;break;
  case "cancelNb":S.editNb=false;break;
  case "saveNb":return saveNotebook();
  case "chat2task":{const log=S.chats[S.sel]||[];const q=[...log].reverse().find(m=>m.role==="user");const an=[...log].reverse().find(m=>m.role==="assistant");if(!an)return;await db.collection("tasks").add({staffId:S.sel,title:(q?q.content:"Hỏi nhanh").slice(0,140),detail:"",kind:"nv",prio:"Thường",due:"",status:"xong",result:an.content,createdAt:Date.now(),updatedAt:Date.now(),history:[{at:Date.now(),text:"Lưu từ Hỏi nhanh"}]});S.tab="viec";break}
  case "addrem":{const id=S.sel;const tx=(S.drafts["rt_"+id]||"").trim();if(!tx)return;try{await db.collection("reminders").add({staffId:id,text:tx,date:S.drafts["rd_"+id]||today(),time:S.drafts["rh_"+id]||"",daily:!!S.drafts["rdaily_"+id],createdAt:Date.now()});S.drafts["rt_"+id]=""}catch(er){setWarn(er.message)}break}
  case "delrem":try{await db.doc("reminders/"+ds.id).delete()}catch(er){setWarn(er.message)}return;
  case "split":return split();
  case "assignAll":return assignAll();
  case "clearPv":S.preview=null;break;
  }
  render();
}
async function saveStaff(){
  const e=S.editing;const role=(e.role||"").trim();if(!role){setWarn("Cần nhập tên vai trò.");return}
  if(/claude\.ai\/share\//.test(e.link||"")){setWarn("Đây là link chia sẻ (bản chụp chỉ đọc). Hãy dùng link claude.ai/chat/… hoặc claude.ai/project/… lấy từ thanh địa chỉ trình duyệt.");return}
  if(e.link&&!/^https:\/\//.test(e.link)){setWarn("Link cần bắt đầu bằng https://");return}
  const body={name:(e.name||"").trim(),role:role,dept:e.dept,link:(e.link||"").trim(),linkType:e.linkType||"Chat",software:e.software||"",profile:e.profile||"",hint:e.hint||"",proactive:e.proactive||{on:false},order:e.order||Date.now(),updatedAt:Date.now()};
  try{if(e.id){await db.doc("staff/"+e.id).set(body)}else{const ref=await db.collection("staff").add(body);S.sel=ref.id}S.editing=null;setWarn("");render()}catch(er){setWarn("Không lưu được nhân viên: "+(er.message||er.code))}
}
async function assign(andTake){
  const s=staffById(S.sel);if(!s)return;const title=(S.drafts["title_"+s.id]||"").trim();if(!title){setWarn("Hãy ghi việc cần giao.");return}
  const k=kindOf(S.kind);const who=S.who||(hasSess(s)?"chat":"trang");
  const status=(hasSess(s)&&who==="chat")?"chat":k.route==="catruc"?"catruc":k.route==="chat"?"chat":"giao";
  try{const ref=await db.collection("tasks").add({staffId:s.id,title:title,detail:"",kind:k.id,prio:S.prio,due:S.drafts["due_"+s.id]||"",status:status,result:"",feedback:"",createdAt:Date.now(),updatedAt:Date.now(),history:[{at:Date.now(),text:"Giám đốc giao việc"}]});
    S.drafts["title_"+s.id]="";setWarn("");render();
    if(andTake&&status==="giao")take(ref.id,{id:ref.id,staffId:s.id,title:title,kind:k.id,prio:S.prio,due:S.drafts["due_"+s.id]||"",status:"giao",history:[]});
  }catch(er){setWarn("Không giao được: "+(er.message||er.code))}
}
function profilePrompt(s){const d=dept(s.dept);return 'Bạn là nhân viên AI giữ vai trò "'+s.role+'" thuộc '+d.name+' của CÔNG TY TNHH MB VH (công ty TNHH hai thành viên, Hải Phòng; mảng kinh doanh chính: gia công lắp ráp tàu thủy). Người giao việc là anh Văn Đinh, CEO (Giám đốc Điều hành); gọi "anh", xưng "em". CEO còn quan tâm truyền thông, kinh tế – chính trị trong và ngoài nước, chính sách nền tảng mạng xã hội, và đang học thêm kế toán – thuế.\nHồ sơ công việc của bạn:\n'+(s.profile||"(chưa có)")+'\n'}
async function take(id,tObj){
  const t=tObj||S.tasks.find(x=>x.id===id);if(!t)return;const s=staffById(t.staffId);const k=kindOf(t.kind);
  if(k.route!=="trang"){await upd(id,{status:k.route==="chat"?"chat":"catruc",history:hist(t,"Chuyển "+(k.route==="chat"?"sang chat":"vào ca trực"))});return}
  if(!sample){setWarn("Trang chưa được phép dùng Claude ở chế độ xem này. Mở trang trên claude.ai để dùng nút Nhận việc.");return}
  S.stream[id]="";render();await upd(id,{status:"lam",history:hist(t,s.role+" nhận việc")});
  const prompt=profilePrompt(s)+ctxFor(s)+'\nViệc được giao: '+t.title+(t.detail?'\nChi tiết: '+t.detail:'')+'\nHạn: '+fmtD(t.due)+' · Ưu tiên: '+(t.prio||"Thường")+
    (t.feedback?'\n\nLần trước Giám đốc yêu cầu sửa: '+t.feedback+'\nBản trước của em:\n'+(t.result||""):"")+
    '\n\nHãy làm trọn việc này và trả về KẾT QUẢ hoàn chỉnh bằng tiếng Việt. Câu đầu là tóm tắt một dòng. Nếu thiếu dữ liệu thật (số liệu, ngày, tên người, số tiền), ghi [cần bổ sung: ...] chứ không tự bịa. Không dùng tiêu đề markdown (#); được dùng gạch đầu dòng "-" và số thứ tự.';
  let last=0;
  try{const r=await sample(prompt,{modelTier:"default",cache:false,onText:x=>{S.stream[id]=x.text;const n=Date.now();if(n-last>200){last=n;render()}}});
    delete S.stream[id];await upd(id,{status:"duyet",result:r.text,history:hist(Object.assign({},t,{history:(S.tasks.find(x=>x.id===id)||t).history}),s.role+" nộp kết quả")});
  }catch(er){delete S.stream[id];await upd(id,{status:"giao",history:hist(t,"Lỗi khi làm: "+(er.code||""))});
    setWarn(er.code==="not_granted"?"Chưa được phép dùng Claude trong trang.":er.code==="rate_limited"?"Claude đang bận (giới hạn lượt). Thử lại sau ít phút.":"Không chạy được: "+(er.message||er.code))}
  render();
}
function ctxFor(s){
  const mine=S.tasks.filter(t=>t.staffId===s.id&&t.result).slice(0,5).map(t=>"- ["+(STS[t.status]||STS.giao)[0]+"] "+t.title+": "+firstLine(t.result).slice(0,300));
  const others=S.tasks.filter(t=>t.staffId!==s.id&&t.result&&["duyet","xong"].includes(t.status)).slice(0,10).map(t=>{const o=staffById(t.staffId)||{};return "- "+disp(o)+" ("+(o.role||"")+", "+dept(o.dept||"bld").name+"): "+t.title+" → "+firstLine(t.result).slice(0,200)});
  const reps=S.reports.slice(0,4).map(r=>{const o=staffById(r.staffId)||{};return "- "+(r.title||"")+" ("+disp(o)+"): "+firstLine(r.body).slice(0,250)});
  const team=S.staff.map(o=>"- "+disp(o)+": "+o.role+" – "+dept(o.dept).name).join("\n");
  return "\n=== SỔ TAY CÔNG TY (CEO ghi) ===\n"+(S.notebook||"(trống)")+
    "\n\n=== ĐỒNG NGHIỆP TRONG VĂN PHÒNG ===\n"+team+
    "\n\n=== VIỆC GẦN ĐÂY CỦA BẠN ===\n"+(mine.join("\n")||"(chưa có)")+
    "\n\n=== KẾT QUẢ GẦN ĐÂY CỦA CÁC PHÒNG KHÁC ===\n"+(others.join("\n")||"(chưa có)")+
    "\n\n=== BẢN TIN GẦN ĐÂY ===\n"+(reps.join("\n")||"(chưa có)")+"\n"}
async function loadChat(sid){if(S.chats[sid]||!db)return;S.chats[sid]=[];try{const d=await db.doc("chats/"+sid).get();if(d.exists){S.chats[sid]=(d.data().messages||[]).slice(-40)}}catch(e){}render()}
async function saveChat(sid){try{await db.doc("chats/"+sid).set({messages:(S.chats[sid]||[]).slice(-40),updatedAt:Date.now()})}catch(e){}}
async function ask(){
  const s=staffById(S.sel);if(!s)return;const q=(S.drafts["q_"+s.id]||"").trim();if(!q)return;
  if(!sample){setWarn("Trang chưa được phép dùng Claude ở chế độ xem này.");return}
  const log=S.chats[s.id]=S.chats[s.id]||[];log.push({role:"user",content:q,at:Date.now()});S.drafts["q_"+s.id]="";S.stream["q_"+s.id]="";render();
  const sys=profilePrompt(s)+ctxFor(s)+'\nBạn đang trao đổi trực tiếp với CEO trong Văn phòng ảo. Dùng thông tin ở trên (sổ tay công ty, hồ sơ của bạn, kết quả của đồng nghiệp) để trả lời nhất quán với cả công ty. Nếu việc cần dữ liệu bạn không có (phần mềm, file, lịch sử đoạn chat riêng) thì nói rõ và đề nghị giao việc cho đoạn chat đã gắn hoặc đồng nghiệp phù hợp (nêu tên). Trả lời ngắn gọn, tiếng Việt, không bịa số liệu.\n\n';
  const hist=log.slice(-16);
  const msgs=hist.map((m,i)=>i===0?{role:"user",content:sys+'Tin nhắn của CEO: '+m.content}:{role:m.role,content:m.content});
  if(msgs[0].role!=="user")msgs.unshift({role:"user",content:sys+"(tiếp tục cuộc trao đổi)"});
  let last=0;
  try{const r=await sample(msgs,{cache:false,onText:x=>{S.stream["q_"+s.id]=x.text;const n=Date.now();if(n-last>200){last=n;render()}}});log.push({role:"assistant",content:r.text,at:Date.now()})}
  catch(er){log.push({role:"assistant",content:"(Không trả lời được: "+(er.code||er.message)+")"})}
  delete S.stream["q_"+s.id];render();saveChat(s.id);
}
async function remember(){
  const s=staffById(S.sel);const log=S.chats[s.id]||[];if(!s||!log.length||!sample)return;
  S.busyMem=true;render();
  const conv=log.slice(-20).map(m=>(m.role==="user"?"CEO: ":"Nhân viên: ")+m.content).join("\n");
  try{const r=await sample('Đây là hồ sơ công việc hiện tại của nhân viên "'+s.role+'":\n'+(s.profile||"(trống)")+'\n\nĐây là đoạn trao đổi gần đây với CEO:\n'+conv+'\n\nHãy viết lại HỒ SƠ CÔNG VIỆC mới: giữ nguyên các thông tin cũ còn đúng, bổ sung quyết định, yêu cầu, sở thích, số liệu quan trọng CEO vừa nêu; bỏ ý đã lỗi thời. Dưới 1.500 chữ, văn bản thuần, không lời dẫn. Chỉ trả về nội dung hồ sơ.',{cache:false});
    const txt=(r.text||"").trim();if(txt){await db.doc("staff/"+s.id).update({profile:txt,updatedAt:Date.now()});setWarn("Đã ghi vào sổ tay của "+disp(s)+".")}}
  catch(er){setWarn("Không ghi được: "+(er.code||er.message))}
  S.busyMem=false;render()}
async function saveNotebook(){const t=(S.drafts.notebook!=null?S.drafts.notebook:S.notebook)||"";try{await db.doc("company/notebook").set({text:t.slice(0,8000),updatedAt:Date.now()});S.editNb=false;setWarn("Đã lưu sổ tay công ty.")}catch(er){setWarn("Không lưu được: "+(er.message||er.code))}render()}
async function split(){
  const c=($("#cmdIn").value||"").trim();if(!c)return;
  if(!sample){setWarn("Trang chưa được phép dùng Claude ở chế độ xem này.");return}
  if(!S.staff.length){setWarn("Chưa có nhân viên nào.");return}
  S.preview={loading:true};render();
  const list=S.staff.map(s=>({staffId:s.id,role:s.role,dept:dept(s.dept).name,software:s.software||""}));
  const prompt='Bạn là thư ký điều phối của CEO Văn Đinh, CÔNG TY TNHH MB VH (TNHH hai thành viên, gia công lắp ráp tàu thủy). Danh sách nhân viên AI (JSON):\n'+JSON.stringify(list)+'\n\nLệnh của Giám đốc: "'+c+'"\n\nHãy chia lệnh thành các việc cụ thể, mỗi việc giao cho ĐÚNG MỘT nhân viên phù hợp nhất trong danh sách. kind là một trong: "nv" (soạn thảo, viết, tóm tắt, trả lời), "web" (cần tìm thông tin mới trên mạng), "doc" (cần đọc dữ liệu phần mềm HR Portal/Project Block/Kế toán), "code" (sửa phần mềm), "chat" (cần trao đổi qua lại). Trả về JSON đúng dạng {"tasks":[{"staffId":"...","title":"...","kind":"nv"}]} và không gì khác. title viết tiếng Việt, rõ ràng, tối đa 140 ký tự.';
  try{const v=await sample.json(prompt,{cache:false});const items=(v&&v.tasks||[]).filter(x=>staffById(x.staffId)).map(x=>({staffId:x.staffId,title:String(x.title||"").slice(0,200),kind:KINDS.some(k=>k.id===x.kind)?x.kind:"nv",on:true}));
    S.preview=items.length?{items:items}:null;if(!items.length)setWarn("Claude chưa chia được lệnh này, thử viết rõ hơn.");}
  catch(er){S.preview=null;setWarn("Không chia được việc: "+(er.code||er.message))}
  render();
}
async function assignAll(){
  const items=(S.preview&&S.preview.items||[]).filter(x=>x.on!==false);
  for(const it of items){const k=kindOf(it.kind);const status=k.route==="catruc"?"catruc":k.route==="chat"?"chat":"giao";
    try{await db.collection("tasks").add({staffId:it.staffId,title:it.title,detail:"Từ lệnh nhanh: "+($("#cmdIn").value||""),kind:k.id,prio:"Thường",due:"",status:status,result:"",feedback:"",createdAt:Date.now(),updatedAt:Date.now(),history:[{at:Date.now(),text:"Giám đốc giao qua lệnh nhanh"}]})}catch(er){setWarn(er.message);break}}
  S.preview=null;$("#cmdIn").value="";render();
}
const REDUCE=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function staffAtSeat(d,i){return S.staff.filter(s=>s.dept===d).sort((a,b)=>(a.order||0)-(b.order||0))[i]}
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function pAt(p,d){for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(d<=l){const t=l?d/l:0;return[p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t]}d-=l}return p[p.length-1]}
const SPEED=60,PAUSE=4000;
function startWalk(f){const s=staffAtSeat(f.dept,f.seat);if(!s||WK[s.id])return;
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.innerHTML=SPR[f.dept];$("#walk").appendChild(g);
  const el=document.createElement("div");el.className="who hb";
  el.innerHTML='<button class="bub" style="--c:'+dept(f.dept).col+'" data-act="pick" data-id="'+s.id+'"><b></b><span class="tx"></span></button><button class="tag" data-act="pick" data-id="'+s.id+'" title="'+esc(s.role)+'">'+esc(disp(s))+'</button>';
  $("#walkers").appendChild(el);
  WK[s.id]={f:f,g:g,el:el,L:plen(f.path),t0:performance.now(),ph:-1};render()}
function tick(now){
  for(const id in WK){const w=WK[id];const tOut=w.L/SPEED*1000,e=now-w.t0;let d,ph;
    if(e<tOut){d=e/1000*SPEED;ph=0}else if(e<tOut+PAUSE){d=w.L;ph=1}else if(e<2*tOut+PAUSE){d=w.L-(e-tOut-PAUSE)/1000*SPEED;ph=2}
    else{w.g.remove();w.el.remove();delete WK[id];render();continue}
    const pt=pAt(w.f.path,Math.max(0,d));
    w.g.setAttribute("transform","translate("+pt[0].toFixed(1)+","+pt[1].toFixed(1)+")");
    w.el.style.left=(pt[0]/19.2)+"%";w.el.style.top=((pt[1]-U*2.15)/12)+"%";
    if(ph!==w.ph){w.ph=ph;w.el.querySelector("b").textContent=["Đang đi","Đang làm việc","Quay về"][ph];w.el.querySelector(".tx").textContent=[w.f.out,w.f.at,w.f.back][ph]}}
  requestAnimationFrame(tick)}
function scheduler(){if(document.hidden||REDUCE||!S.staff.length)return;if(Object.keys(WK).length>=3)return;
  const now=Date.now();const cand=FLOWS.filter(f=>{const s=staffAtSeat(f.dept,f.seat);return s&&!WK[s.id]&&!((f.cool||0)>now)});
  if(!cand.length)return;const f=cand[Math.floor(Math.random()*cand.length)];f.cool=now+45000;startWalk(f)}
setInterval(scheduler,4000);setTimeout(scheduler,1200);requestAnimationFrame(tick);
render();init();
</script>
