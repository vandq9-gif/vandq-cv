<style>
/* Layout: xưởng đóng tàu — thanh điều hướng thép bên trái, vùng làm việc sáng, số liệu canh cột; biên bản là tờ giấy A4 thật */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --line:#d6dce3; --ink:#15212c; --muted:#5b6977;
  --rail:#17283a; --rail-ink:#c9d4df; --rail-active:#24405c;
  --accent:#1d5fa6; --accent-soft:#e3edf8; --mark:#d99a00;
  --good:#1f7a4d; --good-soft:#e2f2e9; --warn:#a86a00; --warn-soft:#fbf0d9; --bad:#b3312c; --bad-soft:#f8e3e2;
  --paper:#ffffff; --paper-ink:#111111; --paper-line:#333333; --ph:#fff1b8; --ph-line:#c99a00;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-doc:"Noto Serif","Times New Roman",Times,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --surface:#16212c; --surface-2:#1b2835; --line:#2a3a4a; --ink:#e4ebf2; --muted:#93a3b3;
  --rail:#0a1219; --rail-ink:#a9b8c6; --rail-active:#1c2f43;
  --accent:#6aa6e8; --accent-soft:#1a3149; --mark:#f0b429;
  --good:#5cc48f; --good-soft:#163527; --warn:#e3a740; --warn-soft:#3a2c12; --bad:#f07a74; --bad-soft:#3d1b1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#16212c; --surface-2:#1b2835; --line:#2a3a4a; --ink:#e4ebf2; --muted:#93a3b3;
  --rail:#0a1219; --rail-ink:#a9b8c6; --rail-active:#1c2f43;
  --accent:#6aa6e8; --accent-soft:#1a3149; --mark:#f0b429;
  --good:#5cc48f; --good-soft:#163527; --warn:#e3a740; --warn-soft:#3a2c12; --bad:#f07a74; --bad-soft:#3d1b1a;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:6px;background:var(--mark);color:#17283a;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{display:block;color:#fff;font-size:14px}
.brand small{font-size:11.5px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;opacity:.55;padding:10px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;color:var(--rail-ink);font-size:13.5px}
.nav button:hover{background:var(--rail-active);color:#fff}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 var(--mark)}
.nav button:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .badge{margin-left:auto;background:var(--mark);color:#17283a;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.rail-foot{margin-top:auto;font-size:11.5px;opacity:.7;padding:0 8px;line-height:1.45}
.main{min-width:0;padding-block:22px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.preview-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:18px}
.preview-bar b{color:var(--warn)}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:22px;margin:0;line-height:1.2;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
:root[data-theme="dark"] .btn.primary{color:#0b1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1520}}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:21px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-size:14.5px;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}

<script>
/* ============ Trạng thái dữ liệu (đọc từ kho online, không nhúng sẵn) ============ */
const STATUSES=["Giao khoán","Đang thi công","Chờ hàn","Hàn xong","Nghiệm thu","Đã quyết toán","Đã thanh toán"];
const DEFAULT_COMPANY={id:"MB",name:"",short:"",mst:"",addr:"",rep:"",role:"",phone:"",bank:""};
const DEFAULT_RATES={vat:8,tndn:17,tncn:10,advance:70};
const S={settings:null,blocks:[],partners:[],contracts:[],prices:[],templates:{},files:{},taxpay:[]};
const loaded=new Set();const NEED=["settings","blocks","partners","contracts","prices","templates","files","taxpay"];
let DB=null,ASSETS=null,DL=null,USER=null,RO=false,FATAL="";
const COMPANY=()=>({...DEFAULT_COMPANY,...(S.settings?.company||{}),id:"MB"});
const DEF_RATES=()=>({...DEFAULT_RATES,...(S.settings?.defaults||{})});
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sid=s=>String(s).replace(/[^A-Za-z0-9_\-]/g,c=>"."+c.charCodeAt(0).toString(16)+".");

/* ============ Tiện ích ============ */
const fmt=n=>Math.round(+n||0).toLocaleString("vi-VN");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
const amt=l=>num(l.amount)!=null?+l.amount:(+l.kg||0)*(+l.price||0);
const sum=(a,f)=>(a||[]).reduce((s,x)=>s+f(x),0);
const P=id=>id==="MB"?COMPANY():S.partners.find(p=>p.id===id);
const pShort=id=>{const p=P(id);return p?(p.short||p.name):"—";};
const today=()=>new Date().toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"});
const sIdx=b=>STATUSES.indexOf(b.status);
const locked=b=>sIdx(b)>=5;
const L=(b,side,kind)=>(b.ledger||[]).filter(x=>x.side===side&&x.kind===kind);
const monthKey=m=>{const [mm,yy]=String(m||"").split("/");return (yy||"0000")+(mm||"00").padStart(2,"0");};
const blocksSorted=()=>S.blocks.slice().sort((a,b)=>monthKey(a.month).localeCompare(monthKey(b.month))||String(a.code).localeCompare(String(b.code)));
const blockById=id=>S.blocks.find(b=>b.id===id);
const contractById=id=>S.contracts.find(c=>c.id===id);
function calc(b){
  const r={...DEFAULT_RATES,...(b.rates||{})};
  const sell=sum(b.sell,amt),weld=sum(b.weld,amt),other=sum(b.costs,c=>+c.amount||0);
  const kgMain=b.sell&&b.sell[0]&&num(b.sell[0].kg)!=null?+b.sell[0].kg:null;
  const sellFine=sum(L(b,"sell","fine"),x=>+x.amount),weldFine=sum(L(b,"weld","fine"),x=>+x.amount);
  const sellAdv=sum(L(b,"sell","advance"),x=>+x.amount),weldAdv=sum(L(b,"weld","advance"),x=>+x.amount);
  const sellPay=sum(L(b,"sell","payment"),x=>+x.amount),weldPay=sum(L(b,"weld","payment"),x=>+x.amount);
  const tndn=num(b.tndnFixed)!=null?+b.tndnFixed:(sell-weld)*r.tndn/100;
  const wage=sum((b.costs||[]).filter(c=>/Lương/i.test(c.name)),c=>+c.amount||0);
  const tncn=num(b.tncnFixed)!=null?+b.tncnFixed:wage*r.tncn/100;
  const vatOut=sell*r.vat/100,vatIn=weld*r.vat/100+(+b.vatMat||0);
  const cost=weld-weldFine+other+tndn+tncn,profit=sell-sellFine-cost;
  const sellGross=sell+vatOut,weldGross=weld*(1+r.vat/100);
  return {r,sell,weld,other,kg:kgMain,tndn,tncn,vatOut,vatIn,vatPay:vatOut-vatIn,cost,profit,perKg:kgMain?profit/kgMain:null,gross:sell-weld,
    sellFine,weldFine,sellAdv,weldAdv,sellPay,weldPay,sellGross,weldGross,
    sellDue:sellGross-sellAdv-sellFine-sellPay,weldDue:weldGross-weldAdv-weldFine-weldPay};
}
const D=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function read3(n,full){const h=Math.floor(n/100),t=Math.floor(n%100/10),u=n%10,s=[];
  if(full||h>0)s.push(D[h]+" trăm");
  if(t>1){s.push(D[t]+" mươi");if(u===1)s.push("mốt");else if(u===5)s.push("lăm");else if(u>0)s.push(D[u]);}
  else if(t===1){s.push("mười");if(u===5)s.push("lăm");else if(u>0)s.push(D[u]);}
  else if(u>0){if(full||h>0)s.push("linh");s.push(D[u]);}
  return s.join(" ");}
function docSo(n){n=Math.round(n);if(n===0)return "Không đồng.";const neg=n<0;n=Math.abs(n);const sc=[""," nghìn"," triệu"," tỷ"],g=[];let x=n;while(x>0){g.push(x%1000);x=Math.floor(x/1000);}
  const out=[];for(let i=g.length-1;i>=0;i--){if(g[i]===0)continue;out.push(read3(g[i],i<g.length-1)+(sc[i]||""));}
  const s=(neg?"âm ":"")+out.join(" ");return s.charAt(0).toUpperCase()+s.slice(1)+" đồng.";}
function pill(st){const c=st==="Đã quyết toán"||st==="Đã thanh toán"?"p-done":st==="Đang thi công"?"p-run":"p-wait";return `<span class="pill ${c}">${esc(st)}</span>`;}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,4000);}
const dis=()=>RO?"disabled":"";
const W=h=>RO?"":h;

/* ============ Ghi dữ liệu ============ */
const chains={};
function queue(path,fn){const p=(chains[path]||Promise.resolve()).then(fn,fn);chains[path]=p.catch(()=>{});return p;}
async function write(path,data){
  if(!DB||RO){toast("Chế độ chỉ xem: không lưu được thay đổi.");return false;}
  try{await queue(path,()=>DB.doc(path).set(data));return true;}
  catch(e){handleErr(e);return false;}

async function remove(path){
  if(!DB||RO)return false;

function handleErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){RO=true;toast("Tài khoản này chỉ được xem, không lưu được.");render();}
  else if(c==="quota_exceeded")toast("Kho dữ liệu đã đầy: "+(e.message||""));
  else if(c==="revoked"){FATAL="Quyền truy cập trang đã thay đổi. Hãy tải lại trang.";render();}
  else toast("Không lưu được ("+(c||"lỗi")+"). Thử lại sau giây lát.");
}

function chart(rows){
  const W2=Math.max(640,rows.length*80),H=270,Ll=58,Rr=12,Tp=14,B=46,max=Math.max(1e8,Math.ceil(Math.max(...rows.map(r=>r.c.sell))/1e8)*1e8),min=Math.min(0,Math.floor(Math.min(...rows.map(r=>r.c.profit))/1e8)*1e8);
  const y=v=>Tp+(max-v)/(max-min)*(H-Tp-B);const n=rows.length,slot=(W2-Ll-Rr)/n,bw=Math.min(18,slot/4.2);
  let g="";for(let v=min;v<=max;v+=1e8){g+=`<line x1="${Ll}" x2="${W2-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.2:.6}"/><text x="${Ll-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v/1e6}tr</text>`;}
  rows.forEach((r,i)=>{const cx=Ll+slot*i+slot/2,c=r.c;
    const bar=(x,v,col)=>{const y0=y(Math.max(v,0)),h=Math.abs(y(v)-y(0));return `<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(h,1)}" rx="2" fill="${col}"/>`;};
    const lbl=String(r.b.code).split(/[\/ ]/)[0];
    g+=`<g data-open="${esc(r.b.id)}" style="cursor:pointer"><title>${esc(r.b.code)}: doanh thu ${fmt(c.sell)}, chi phí ${fmt(c.cost)}, lợi nhuận ${fmt(c.profit)}</title>`+bar(cx-bw*1.5-2,c.sell,"var(--accent)")+bar(cx-bw/2,c.cost,"var(--line)")+bar(cx+bw/2+2,c.profit,c.profit<0?"var(--bad)":"var(--good)")+
      `<text x="${cx}" y="${H-B+18}" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">${esc(lbl)}</text><text x="${cx}" y="${H-B+33}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(r.b.month||"")}</text></g>`;});
  return `<svg class="chart" viewBox="0 0 ${W2} ${H}" role="img" aria-label="Doanh thu, chi phí, lợi nhuận theo Block" style="min-width:520px">${g}</svg>`;
}

  <div class="panel"><div class="side-h"><h3>Chi phí khác</h3><span class="code">${fmt(c.other)}</span></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th style="min-width:220px">Khoản chi</th><th class="n">Số tiền</th><th style="min-width:160px">Ghi chú</th><th></th></tr></thead><tbody>
    ${(b.costs||[]).map((x,i)=>`<tr><td><input class="cell-in" data-line="costs" data-i="${i}" data-f="name" value="${esc(x.name)}" ${dis()} aria-label="Khoản chi"></td><td><input class="cell-in num" type="number" data-line="costs" data-i="${i}" data-f="amount" value="${esc(x.amount)}" ${dis()} aria-label="Số tiền"></td><td><input class="cell-in" data-line="costs" data-i="${i}" data-f="note" value="${esc(x.note||"")}" ${dis()} aria-label="Ghi chú"></td><td>${W(`<button class="btn sm danger" data-del-line="costs" data-i="${i}" aria-label="Xóa dòng">×</button>`)}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">Chưa có khoản chi.</td></tr>`}

/* ============ Tạm ứng, phạt & thanh toán ============ */
const KIND={advance:["Tạm ứng","p-run"],fine:["Lỗi phạt","p-bad"],payment:["Thanh toán","p-done"]};
function vLedger(b,c){
  const sideP=s=>s==="weld"?(b.weldBy?pShort(b.weldBy):"tổ hàn"):"KHA";
  const panel=(side,title,hint)=>{const items=(b.ledger||[]).filter(x=>x.side===side);const gross=side==="weld"?c.weldGross:c.sellGross;
    const adv=sum(L(b,side,"advance"),x=>+x.amount),fin=sum(L(b,side,"fine"),x=>+x.amount),pay=sum(L(b,side,"payment"),x=>+x.amount);
    const row=x=>{const fk=x.kind==="payment"?null:`${b.id}|${side}|${x.kind==="advance"?"tu":"ph"}|${x.id}`;
      return `<tr><td>${esc(x.date)}</td><td><span class="pill ${KIND[x.kind][1]}">${KIND[x.kind][0]}</span></td><td><span class="code">${esc(x.no)}</span><div>${esc(x.desc)}</div></td><td class="n">${fmt(x.amount)}</td><td>${fk?(isDone(fk)?'<span class="st ok"><i></i>Có bản ký</span>':'<span class="st miss"><i></i>Chưa ký</span>'):'<span class="muted">—</span>'}</td><td>${W(state.confirm==="led-"+x.id?`<button class="btn sm danger" data-del-ledger="${esc(x.id)}">Xóa?</button>`:`<button class="btn sm" data-ask-del-ledger="${esc(x.id)}" aria-label="Xóa">×</button>`)}</td></tr>`;};
    return `<div class="panel"><div class="side-h"><h3>${title}</h3><span class="muted" style="font-size:12px">${hint}</span></div>
      <div class="ledger-sum"><div><span>Quyết toán (gồm VAT)</span><b>${fmt(gross)}</b></div><div><span>Đã tạm ứng</span><b>${fmt(adv)}</b></div><div><span>Lỗi phạt trừ lại</span><b>${fmt(fin)}</b></div><div><span>Đã thanh toán</span><b>${fmt(pay)}</b></div><div><span>Còn lại</span><b class="${gross-adv-fin-pay<0?"neg":""}">${fmt(gross-adv-fin-pay)}</b></div></div>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>Ngày</th><th>Loại</th><th>Số / nội dung</th><th class="n">Số tiền</th><th>Hồ sơ</th><th></th></tr></thead><tbody>${items.map(row).join("")||`<tr><td colspan="6" class="muted">Chưa có khoản nào.</td></tr>`}</tbody></table></div></div>`;};
  return W(`<div class="panel" style="margin-bottom:14px"><h2>Ghi khoản mới</h2><p class="sub">Tạm ứng và lỗi phạt tự sinh biên bản, tự trừ vào Quyết toán của đúng bên và được nhắc lưu bản ký. Thanh toán dùng để theo dõi công nợ.</p>
    <div class="form">
      <div class="field"><label for="lg-side">Bên</label><select id="lg-side"><option value="weld">MB ↔ ${esc(sideP("weld"))} (tổ hàn)</option><option value="sell">KHA ↔ MB</option></select></div>
      <div class="field"><label for="lg-kind">Loại</label><select id="lg-kind"><option value="advance">Tạm ứng</option><option value="fine">Lỗi phạt</option><option value="payment">Thanh toán</option></select></div>
      <div class="field"><label for="lg-date">Ngày</label><input id="lg-date" value="${today()}"></div>
      <div class="field"><label for="lg-no">Số chứng từ</label><input id="lg-no" placeholder="Tự đánh số nếu để trống"></div>
      <div class="field" style="grid-column:span 2"><label for="lg-desc">Nội dung</label><input id="lg-desc" placeholder="VD: Tạm ứng đợt 2 / Lỗi hàn rỗ khí vách 12"></div>
      <div class="field"><label for="lg-amt">Số tiền (đ)</label><input id="lg-amt" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="field"><button class="btn primary" data-add-ledger>Thêm khoản</button></div>
    </div></div>`)+`
  <div class="grid">${panel("weld",`Bên hàn · ${esc(sideP("weld"))}`,"MB ứng tiền / phạt / trả tổ hàn")}${panel("sell","Bên bán · KHA","KHA ứng tiền / phạt / trả MB")}</div>`;
}

const sellPartner=()=>S.partners.find(p=>p.type==="Khách hàng")||{id:null,name:"(CHƯA CÓ KHÁCH HÀNG)",short:"khách hàng"};
function sides(b){

function fill(tpl,vals,edit){

  });
}

const HD_COMMON_B=`<p>– Chịu trách nhiệm về nhân công thi công.</p><p>– Đảm bảo an toàn trong lao động, sản xuất. Nếu xảy ra sự cố bên B phải chịu trách nhiệm hoàn toàn về công nhân của mình.</p><p>– Chấp hành nghiêm các nội quy, quy chế của Nhà máy ABC.</p><p>– Chịu trách nhiệm về phương tiện đi lại, ăn nghỉ của công nhân, đảm bảo cho công nhân mang mặc bảo hộ đúng quy định, đóng BHXH và bảo hiểm tai nạn 24/24 cho công nhân.</p><p>– Công nhân của bên B để xảy ra mất an toàn lao động cho bản thân và làm thiệt hại đến tài sản của TBD thì bên B phải chịu hoàn toàn trách nhiệm trước cơ quan pháp luật và thiệt hại đối với bên A.</p><p>– Khi thi công bên B cần máy móc thiết bị nâng hạ hỗ trợ phải báo trước cho Quản lý của TBD hoặc bộ phận kho bố trí, sắp xếp.</p><p>– Vật tư phụ được cấp (oxy, gas, que hàn, CO2, dây hàn…) bên B phải sử dụng tiết kiệm.</p><p>– Sau khi hoàn thiện xong sản phẩm, phải hoàn trả lại mặt bằng thi công như ban đầu.</p><p>* Khi bên B giao đồ dùng, dụng cụ bên B phải tự quản lý: Hỏng do khách quan (như hao mòn) đổi lại cho TBD, do chủ quan bên B tự chịu trách nhiệm. Bị mất: sau thời gian làm việc bên B phải bàn giao đồ dùng dụng cụ cho bảo vệ của TBD; nếu không bàn giao thì bên B phải chịu. Trong quá trình thi công, nếu thấy mất an toàn lao động nhà máy có quyền dừng hoạt động của bên B và xử phạt theo quy định của TBD.</p>`;
const HD_A=`<p class="art">Điều 3: TRÁCH NHIỆM VÀ QUYỀN HẠN CỦA BÊN A</p><p>1. Trách nhiệm:</p><p>– Cung cấp các máy móc thiết bị phục vụ thi công như máy hàn, máy cắt, máy mài, búa, đục, tăng đơ và các vật tư tiêu hao cho thiết bị của mình cấp cho bên B.</p><p>– Cung cấp mặt bằng, điện, nước phục vụ thi công.</p><p>– Cung cấp các loại vật liệu phụ như: que hàn, dây hàn lõi thuốc, sứ lót đường hàn, khí hàn, khí cắt (gas, Oxy, CO2), đá mài, đá cắt.</p><p>– Cung cấp các thiết bị nâng: xe cẩu tự hành bánh lốp (bao gồm cả xăng dầu) nếu các công việc được bố trí ngoài trời, nơi không có cầu trục.</p><p>– Cung cấp vật tư gia công các thiết bị đồ gá, sàn gá và trang thiết bị an toàn phục vụ thi công.</p><p>– Cung cấp quy trình hàn, quy trình gia công, lắp đặt, hồ sơ và bản vẽ thiết kế cho bên B; danh mục các hạng mục cần kiểm tra; giám sát kỹ thuật trong suốt quá trình thi công; cùng bên B nghiệm thu từng bước công nghệ và khối lượng công việc.</p><p>– Thực hiện nghiêm túc các điều khoản trong hợp đồng; tạo điều kiện về ánh sáng, vật tư, máy móc thiết bị khi bên B phải làm thêm giờ cho kịp tiến độ.</p><p>2. Quyền hạn: Nếu bên B vi phạm hợp đồng thì bên A có quyền tạm ngừng việc, thay đổi tạm hoãn, chấm dứt hợp đồng.</p>
 <p class="art">Điều 4: PHẠT VI PHẠM HỢP ĐỒNG</p><p>– Nếu Bên B không hoàn thành đúng thời hạn thì tùy mức độ, Bên A sẽ ra văn bản phạt hợp đồng nhưng tổng số phạt không quá mức phạt tối đa theo Luật Thương mại số 36/2005/QH11 ngày 14/06/2005.</p><p>– Nếu bên A thanh toán chậm cho bên B thì số tiền thanh toán chậm được tính lãi suất ngân hàng tại thời điểm chi trả và không quá 30 ngày kể từ thời điểm chậm trả đầu tiên.</p><p>– Nếu bên B làm sai hỏng các kết cấu mà bên A, Đăng kiểm và chủ đầu tư không nghiệm thu được thì bên B phải bồi thường phần sai hỏng đó, giá trị bồi thường bằng chi phí cho chi tiết sai hỏng (bao gồm cả nhân công và vật tư).</p><p>– Nếu phát hiện hành vi tham ô, trộm cắp tài sản của bên A thì đại diện bên B phải chịu hoàn toàn trách nhiệm; bắt được quả tang bên B phải chịu phạt 1 gấp 10 lần giá trị hiện vật tham ô, lấy cắp.</p><p>– Chấp hành nghiêm các nội quy, quy chế của bên A; mang mặc bảo hộ lao động đúng quy định; tuân thủ các quy định về an toàn lao động.</p>
 <p class="art">Điều 5: BẢO MẬT THÔNG TIN</p><p>– Bên B cam kết giữ bí mật tất cả các thông tin liên quan đến Hợp đồng này và mọi thông tin khác được bên A cung cấp, trừ khi việc tiết lộ được bên A đồng ý trước bằng văn bản.</p><p>– Bên B không được phép sao chép, mô phỏng hoặc để lộ toàn bộ hay một phần dữ liệu bên A cung cấp cho mục đích ngoài phạm vi hợp đồng này.</p><p>– Trong suốt quá trình thực hiện công việc cho bên A, bên B không được phép giao dịch trực tiếp với khách hàng đối tác (chủ đầu tư) của bên A.</p>
 <p class="art">Điều 6: CAM KẾT CHUNG</p><p>– Hai bên cam kết thực hiện đầy đủ các điều khoản ghi trong hợp đồng. Trong quá trình thực hiện nếu gặp khó khăn, trở ngại hoặc có thay đổi thì phải thông báo cho nhau để cùng bàn bạc giải quyết.</p><p>– Mọi tranh chấp phát sinh liên quan đến hợp đồng này được đưa ra giải quyết tại Tòa án Kinh tế thành phố Hải Phòng. Phán quyết của tòa án là quyết định cuối cùng, lệ phí tòa án do bên có lỗi chịu.</p><p>– Hợp đồng có hiệu lực từ ngày ký, được lập thành 02 bản có giá trị pháp lý như nhau, mỗi bên giữ 01 bản; tự động hết hiệu lực khi hai bên thực hiện xong tất cả các nghĩa vụ của mình.</p>`;
const HD_HEAD=t=>`${NAT}<h3>${t}</h3><p class="c">Số: {{so}}</p><p><i>Căn cứ Bộ luật Dân sự số 91/2015/QH13 ngày 24/11/2015, có hiệu lực từ ngày 01/01/2017; căn cứ vào khả năng và nhu cầu của hai bên.</i></p><p>Hôm nay, {{hd_ngay}}, chúng tôi gồm có:</p>
 <p><b>BÊN GIAO KHOÁN: {{A_ten}}</b> (gọi tắt là bên A)</p>{{bang_A}}<p><b>BÊN NHẬN KHOÁN: {{B_ten}}</b> (gọi tắt là bên B)</p>{{bang_B}}<p>Sau khi bàn bạc, thỏa thuận, hai bên thống nhất ký kết hợp đồng giao khoán nhân công với những điều khoản sau:</p>`;
const DEF_HD={
 hd_sell:HD_HEAD("HỢP ĐỒNG KINH TẾ")+`<p class="art">Điều 1: NỘI DUNG HỢP ĐỒNG GIAO KHOÁN</p><p>Bên A đồng ý giao khoán và bên B đồng ý nhận khoán thi công các công việc tại nhà máy đóng tàu ABC (theo Phụ lục hợp đồng hoặc Biên bản giao khoán).</p><p>Thời gian thực hiện: theo tiến độ bên A xác nhận. Địa điểm làm việc: Nhà máy đóng tàu ABC (địa điểm minh họa).</p><p>Bên B cử ra 01 hoặc 02 người làm đại diện để làm việc với bộ phận kho: nhận trang thiết bị, vật tư, chốt công hằng ngày.</p><p>Hao hụt nguyên vật liệu tôn sắt thép tối thiểu cho phép: theo thỏa thuận giữa bên A và TBD. Nếu bên khoán muốn cho công nhân làm tăng ca thì phải báo trước cho ban lãnh đạo.</p>
  <p class="art">Điều 2: TRÁCH NHIỆM VÀ QUYỀN HẠN CỦA BÊN B</p><p>– Nhận các hạng mục công việc và bàn giao từ nhà máy ABC để thực hiện công việc theo hợp đồng giữa nhà máy và bên A.</p><p>– Gia công theo bản vẽ nhà máy ABC cung cấp (không bao gồm các phần công việc cắt CNC).</p><p>– Được sử dụng thiết bị dùng chung trong nhà xưởng như cầu trục, cẩu, máy ép thủy lực, máy uốn thép hình… trong phạm vi hợp đồng.</p><p>– Sửa chữa các khuyết tật phát hiện từ giám sát nhà máy; chất lượng sản phẩm phải được bên A hoặc TBD nghiệm thu bằng biên bản; nghiệm thu xong bước công nghệ trước mới được chuyển bước tiếp theo.</p>${HD_COMMON_B}
  <p><b>+ Đơn giá nhân công:</b> căn cứ vào thông báo đơn giá của nhà máy ABC, tùy thuộc từng hạng mục đã ký kết trong Biên bản giao khoán. Các hạng mục phát sinh hai bên ký phụ lục hợp đồng. Đơn giá chưa bao gồm VAT.</p>
  <p><b>+ Phương thức thanh toán:</b> Bên A tạm ứng hằng tháng theo tiến độ thi công nhưng không quá 95% khối lượng gia công hoàn thành trước khi đấu đà và không quá 95% khối lượng hoàn thành trước khi tàu chạy. Thanh toán 100% số tiền còn lại khi đấu đà xong có biên bản nghiệm thu ký xác nhận giữa kỹ thuật 2 bên, bên B xuất hóa đơn GTGT hợp lệ; thời gian thanh toán chậm nhất sau 10 ngày.</p>`+HD_A+SIGN("ĐẠI DIỆN BÊN A","ĐẠI DIỆN BÊN B"),
 hd_weld:HD_HEAD("HỢP ĐỒNG KHOÁN")+`<p class="art">Điều 1: NỘI DUNG HỢP ĐỒNG GIAO KHOÁN</p><p>Bên A đồng ý giao khoán và bên B đồng ý nhận khoán thi công các hạng mục cụ thể tại nhà máy đóng tàu ABC (theo Phụ lục hợp đồng hoặc Biên bản giao khoán).</p><p>Thời gian thực hiện: theo tiến độ bên A xác nhận. Địa điểm làm việc: Nhà máy đóng tàu ABC (địa điểm minh họa).</p>
  <p class="art">Điều 2: TRÁCH NHIỆM VÀ QUYỀN HẠN CỦA BÊN B</p><p>– Nhận các hạng mục công việc hàn bên A bàn giao khi hoàn thiện việc đính gá.</p><p>– Được sử dụng thiết bị dùng chung trong nhà xưởng như cầu trục, cẩu, máy ép thủy lực, máy uốn thép hình… trong phạm vi hợp đồng.</p><p>– Sửa chữa các khuyết tật phát hiện từ giám sát nhà máy; chất lượng sản phẩm phải được bên A hoặc TBD nghiệm thu bằng biên bản; nghiệm thu xong bước trước mới được chuyển bước tiếp theo.</p><p>– Bảo đảm tiến độ thi công theo yêu cầu của bên A, tính từ ngày bàn giao ghi tại Biên bản bàn giao.</p>${HD_COMMON_B}
  <p><b>+ Đơn giá nhân công:</b> được nêu cụ thể trong các Phụ lục hợp đồng hoặc Biên bản giao khoán tiếp theo (thống nhất thỏa thuận giữa 2 bên). Các hạng mục phát sinh hai bên ký phụ lục hợp đồng. Đơn giá chưa bao gồm VAT.</p>
  <p><b>+ Phương thức thanh toán:</b> Thanh toán 100% khi có biên bản nghiệm thu ký xác nhận giữa kỹ thuật 2 bên, bên B xuất hóa đơn GTGT hợp lệ cho bên A; thời gian thanh toán chậm nhất sau 10 ngày. Các khoản tạm ứng và lỗi phạt được khấu trừ khi quyết toán.</p>`+HD_A+SIGN("ĐẠI DIỆN BÊN A","ĐẠI DIỆN BÊN B"),
 pl:`${NAT}<h3>PHỤ LỤC HỢP ĐỒNG</h3><p class="c">Số: PL…/{{so}}</p><p>Căn cứ Hợp đồng số {{so}} ký {{hd_ngay}}. Hôm nay, ngày …… tháng …… năm ……, chúng tôi gồm:</p>
  <p><b>BÊN A: {{A_ten}}</b></p>{{bang_A}}<p><b>BÊN B: {{B_ten}}</b></p>{{bang_B}}<p>Hai bên thống nhất bổ sung hạng mục và đơn giá như sau:</p>{{bang_pl}}<p>Các điều khoản khác giữ nguyên theo hợp đồng. Phụ lục là phần không tách rời của hợp đồng, lập thành 02 bản, mỗi bên giữ 01 bản.</p>${SIGN("ĐẠI DIỆN BÊN A","ĐẠI DIỆN BÊN B")}`,
 tl:`${NAT}<h3>BIÊN BẢN THANH LÝ HỢP ĐỒNG</h3><p class="c">Căn cứ Hợp đồng số {{so}} ký {{hd_ngay}}</p><p>Hôm nay, ngày …… tháng …… năm ……, chúng tôi gồm:</p>
  <p><b>BÊN A: {{A_ten}}</b></p>{{bang_A}}<p><b>BÊN B: {{B_ten}}</b></p>{{bang_B}}
  <p class="art">Điều 1: Giá trị thực hiện</p><p>Tổng giá trị các Block đã thực hiện theo hợp đồng (gồm VAT): <b>{{gia_tri}}</b> đồng.</p><p>Bằng chữ: <i>{{chu_gia_tri}}</i></p>{{bang_pl}}
  <p class="art">Điều 2: Thanh lý</p><p>Bên A đã thanh toán đủ cho bên B sau khi khấu trừ các khoản tạm ứng và lỗi phạt. Hai bên không còn nghĩa vụ nào với nhau và đồng ý thanh lý hợp đồng.</p><p>Biên bản lập thành 02 bản có giá trị như nhau, mỗi bên giữ 01 bản.</p>${SIGN("ĐẠI DIỆN BÊN A","ĐẠI DIỆN BÊN B")}`
};
function contractVals(c){
  const p=P(c.partner)||{};const isSell=p.type==="Khách hàng";const Sd={A:isSell?p:COMPANY(),B:isSell?COMPANY():p};
  const blocks=blocksSorted().filter(b=>isSell?b.contractSell===c.no:b.contractWeld===c.no);
  const val=sum(blocks,b=>{const r={...DEFAULT_RATES,...(b.rates||{})};return sum(isSell?b.sell:b.weld,amt)*(1+r.vat/100);});
  const [d,m,y]=String(c.date||"").split("/");
  return {...partyVals(Sd),so:c.no,hd_ngay:c.date?`ngày ${d} tháng ${m} năm ${y}`:"ngày …/…/……",gia_tri:fmt(val),chu_gia_tri:docSo(val),
   bang_pl:`<table><thead><tr><th>STT</th><th>Block / hạng mục</th><th>Khối lượng (kg)</th><th>Đơn giá (VNĐ/kg)</th><th>Thành tiền (VNĐ)</th></tr></thead><tbody>${blocks.flatMap(b=>(isSell?b.sell:b.weld).map(l=>({b,l}))).map((x,i)=>`<tr><td class="c">${i+1}</td><td>${esc(x.b.code)}: ${esc(x.l.name)}</td><td class="n">${num(x.l.kg)!=null?fmt(x.l.kg):"—"}</td><td class="n">${num(x.l.price)!=null?fmt(x.l.price):"—"}</td><td class="n">${fmt(amt(x.l))}</td></tr>`).join("")||`<tr><td colspan="5" class="c"><i>Chưa có Block nào gắn hợp đồng này</i></td></tr>`}</tbody></table>`};
}
function vContracts(){
  const c=state.contract?contractById(state.contract):null;
  let viewer="";
  if(c){const p=P(c.partner)||{};const isSell=p.type==="Khách hàng",type=state.cdoc==="hd"?(isSell?"hd_sell":"hd_weld"):state.cdoc;
    const tpl=S.templates[tplKey(p.id,type)]?.html??DEF_HD[type];
    viewer=`<div class="panel" style="margin-top:14px"><div class="side-h"><h2>${esc(c.no)} · ${esc(pShort(c.partner))}</h2><button class="btn sm" data-close-contract>Đóng</button></div>
     <div class="docbar"><div class="seg">${[["hd","Hợp đồng"],["pl","Phụ lục"],["tl","Thanh lý"]].map(([k,l])=>`<button data-cdoc="${k}" aria-pressed="${state.cdoc===k}">${l}</button>`).join("")}</div>
     <div class="actions" style="margin-left:auto">${FILE("hd|"+c.id)?.assetId?`<button class="btn" data-view-file="hd|${esc(c.id)}">Xem bản đã ký</button>`:(ASSETS&&!RO?`<button class="btn" data-scan="hd|${esc(c.id)}">📷 Scan bản ký</button><button class="btn" data-upload="hd|${esc(c.id)}">Tải bản ký lên</button>`:"")}</div></div>
     ${editorBlock(tpl,contractVals(c),p.id,type,isSell?"Mẫu cho Khách hàng (giao khoán nhân công)":"Mẫu cho Tổ hàn (khoán hàn)",`${state.cdoc.toUpperCase()}_${c.no}`.replace(/[\/\\:*?"<>| ]+/g,"."))}</div>`;}
  return header("Hợp đồng","In hợp đồng, phụ lục, thanh lý theo từng loại đối tác; lưu bản scan sau khi ký",W(`<button class="btn primary" data-add-contract>+ Tạo hợp đồng</button>`))+`
  ${S.contracts.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>Số hợp đồng</th><th>Ngày ký</th><th>Đối tác</th><th>Loại mẫu</th><th>Trạng thái</th><th>Bản đã ký</th><th></th></tr></thead><tbody>
  ${S.contracts.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no))).map(x=>{const p=P(x.partner)||{};return `<tr><td class="code">${esc(x.no)}</td><td>${esc(x.date)}</td><td>${esc(pShort(x.partner))}</td><td>${p.type==="Khách hàng"?"Khách hàng · giao khoán nhân công":"Tổ hàn · khoán hàn"}</td><td><span class="pill ${x.status==="Hiệu lực"?"p-done":"p-wait"}">${esc(x.status)}</span></td><td>${fileCell("hd|"+x.id)}</td><td style="white-space:nowrap"><button class="btn sm primary" data-open-contract="${esc(x.id)}">Xem / in</button> ${W(`<button class="btn sm" data-edit-contract="${esc(x.id)}">Sửa</button>`)}</td></tr>`;}).join("")}
  </tbody></table></div>`:`<div class="empty">Chưa có hợp đồng.</div>`}${viewer}`;
}

function vCosts(){
  const opts=[["all","Tất cả Block"],...blocksSorted().map(b=>[b.id,b.code])];const list=[];
  blocksSorted().forEach(b=>{if(state.costBlock!=="all"&&state.costBlock!==b.id)return;const c=calc(b);(b.costs||[]).forEach(x=>list.push([b,x.name,+x.amount||0,x.note]));list.push([b,`Thuế TNDN tạm trích (${c.r.tndn}%)`,c.tndn,""]);if(c.tncn)list.push([b,`Thuế TNCN (${c.r.tncn}%)`,c.tncn,""]);});
  const cat={};list.forEach(r=>{const k=/Lương|thưởng/i.test(r[1])?"Lương & thưởng":/TNDN|TNCN/.test(r[1])?"Thuế tạm trích":/BHXH/.test(r[1])?"BHXH":/KTT|kế toán|vận hành|phần mềm/i.test(r[1])?"Dịch vụ doanh nghiệp":/Vật tư|dụng cụ/i.test(r[1])?"Vật tư & CCDC":/ăn|trọ/i.test(r[1])?"Ăn ở":"Khác";cat[k]=(cat[k]||0)+r[2];});
  const tot=sum(list,r=>r[2]);
  return header("Chi phí","Chi phí theo Block, chưa gồm tiền thuê hàn",W(`<button class="btn primary" data-add-cost>+ Ghi chi phí</button>`)+BTN_X())+`
  <div class="docbar"><div class="field"><label for="cost-block">Lọc theo Block</label><select id="cost-block">${optList(opts,state.costBlock)}</select></div></div>
  <div class="grid two"><div class="tbl-wrap"><table class="t"><thead><tr><th>Block</th><th>Tháng</th><th>Khoản chi</th><th class="n">Số tiền</th></tr></thead><tbody>
  ${list.map(r=>`<tr class="click" data-open="${esc(r[0].id)}" data-tab="money"><td>${esc(r[0].code)}</td><td>${esc(r[0].month)}</td><td>${esc(r[1])}${r[3]?`<div class="muted" style="font-size:12px">${esc(r[3])}</div>`:""}</td><td class="n">${fmt(r[2])}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="3">Cộng</td><td class="n">${fmt(tot)}</td></tr></tfoot></table></div>
  <div class="panel"><h2>Cơ cấu chi phí</h2><p class="sub">Tỷ trọng theo nhóm</p>
  ${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${k}</span><span class="code">${fmt(v)} · ${tot?(v/tot*100).toFixed(1):0}%</span></div><div style="height:7px;background:var(--surface-2);border-radius:4px;margin-top:4px;overflow:hidden"><div style="width:${tot?v/tot*100:0}%;height:100%;background:var(--accent)"></div></div></div>`).join("")}</div></div>`;
}

/* ============ Hộp thoại & biểu mẫu ============ */
let modalSave=null;
function modal(title,body,onSave,saveLabel="Lưu"){modalSave=onSave||null;document.getElementById("modal-root").innerHTML=`<div class="overlay" data-close-modal><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${esc(title)}</h2><button class="btn sm" data-close-modal>Đóng</button></div><div class="modal-b">${body}${onSave?`<div class="actions" style="margin-top:14px"><button class="btn primary" data-modal-save>${esc(saveLabel)}</button></div>`:""}</div></div></div>`;}
function closeModal(){document.getElementById("modal-root").innerHTML="";modalSave=null;SCAN=null;flush();}
const mv=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
const mf=(id,l,v="",t="text",extra="")=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${extra}></div>`;
const ms=(id,l,opts,cur)=>`<div class="field"><label for="${id}">${l}</label><select id="${id}">${optList(opts,cur)}</select></div>`;
document.getElementById("modal-root").addEventListener("click",async e=>{
  if(e.target.matches("[data-close-modal]")&&(e.target.classList.contains("overlay")||e.target.tagName==="BUTTON"))return closeModal();
  if(e.target.closest("[data-modal-save]")&&modalSave){const btn=e.target.closest("[data-modal-save]");btn.disabled=true;const ok=await modalSave();if(ok!==false)closeModal();else btn.disabled=false;}
  const dlf=e.target.closest("[data-dl-file]");if(dlf)return downloadAsset(dlf.dataset.dlFile);
  if(e.target.closest("[data-scan-take]"))return document.getElementById("scan-cam").click();
  if(e.target.closest("[data-scan-pick]"))return document.getElementById("scan-pick").click();
  const sa=e.target.closest("[data-scan-act]");if(sa)return scanAct(sa.dataset.scanAct,+sa.dataset.i);
  const sm=e.target.closest("[data-scan-mode]");if(sm){SCAN.mode=sm.dataset.scanMode;return drawScan();}
  if(e.target.closest("[data-scan-save]"))return saveScan(e.target.closest("[data-scan-save]"));
  const del=e.target.closest("[data-modal-del]");if(del){if(del.dataset.armed){await remove(del.dataset.modalDel);closeModal();toast("Đã xóa.");}else{del.dataset.armed="1";del.textContent="Bấm lần nữa để xóa hẳn";}}
});
function addBlockModal(){

  const sellC=S.contracts.filter(x=>P(x.partner)?.type==="Khách hàng").map(x=>[x.no,x.no]);const weldC=S.contracts.filter(x=>P(x.partner)?.type==="Tổ hàn").map(x=>[x.no,x.no]);

   ${mf("nb-ps","Đơn giá bán (đ/kg)",sp?sp.price:"","number")}${mf("nb-pw","Đơn giá thuê hàn (đ/kg)",wp?wp.price:"","number")}

   <div class="field"><label for="nb-cs">HĐ bán</label><select id="nb-cs">${optList(sellC,sellC[0]?.[0])}</select></div>
   <div class="field"><label for="nb-cw">HĐ thuê hàn</label><select id="nb-cw">${optList(weldC,"","Chưa chọn")}</select></div></div>
   <p class="note">Block mới chốt thuế suất mặc định hiện tại: VAT ${d.vat}%, TNDN ${d.tndn}%, TNCN ${d.tncn}%, tạm ứng ${d.advance}%.</p>`,async()=>{

    const b={id,code,ship:mv("nb-ship"),month:mv("nb-month"),status:"Giao khoán",weldBy:mv("nb-weld")||null,rates:{...d},contractSell:mv("nb-cs"),contractWeld:mv("nb-cw"),gkSell:"",gkWeld:"",
      sell:[{name:`Block ${code}: Gia công chi tiết, lắp ráp, hàn, lắp đặt phụ kiện gắn kèm block`,kg,price:ps,amount:null}],weld:[{name:`Block ${code}: Hàn block, phụ kiện gắn kèm block`,kg,price:pw,amount:null}],costs:[],tndnFixed:null,tncnFixed:null,vatMat:0,ledger:[],createdAt:today()};
    if(!(await saveBlock(b)))return false;S.blocks.push(b);go("blocks",id);toast(`Đã tạo Block ${code}.`);

let SCAN=null;
const SCAN_MODES=[["orig","Ảnh gốc"],["enhance","Làm rõ (xám)"],["bw","Đen trắng"]];
function openScanner(key){
  if(!ASSETS)return toast("Chỉ người có quyền Editor/Owner mới lưu bản scan được.");
  SCAN={key,pages:[],mode:"enhance"};
  modal("Scan biên bản đã ký",`<p class="sub" style="margin:0 0 10px">Chụp từng trang bằng camera điện thoại (hoặc chọn ảnh có sẵn). Phần mềm làm phẳng màu, ghép thành một file PDF A4 rồi lưu vào hồ sơ.</p>
   <div class="actions"><button class="btn primary" data-scan-take>📷 Chụp trang</button><button class="btn" data-scan-pick>Chọn ảnh có sẵn</button></div><div id="scan-body"></div>`);
  drawScan();
}
function procCanvas(pg,maxSide,mode){
  const src=pg.bmp,rot=((pg.rot%360)+360)%360,sw=src.width,sh=src.height;const sc=Math.min(1,maxSide/Math.max(sw,sh));
  const w=Math.round(sw*sc),h=Math.round(sh*sc);const c=document.createElement("canvas");const rotated=rot===90||rot===270;c.width=rotated?h:w;c.height=rotated?w:h;
  const x=c.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(src,-w/2,-h/2,w,h);x.setTransform(1,0,0,1,0,0);
  if(mode!=="orig"){const im=x.getImageData(0,0,c.width,c.height),d=im.data,n=d.length/4,hist=new Uint32Array(256),g=new Uint8ClampedArray(n);
    for(let i=0;i<n;i++){const v=(d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114)|0;g[i]=v;hist[v]++;}
    if(mode==="enhance"){let lo=0,hi=255,acc=0;for(let v=0;v<256;v++){acc+=hist[v];if(acc>n*0.02){lo=v;break;}}acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>n*0.10){hi=v;break;}}const r=Math.max(1,hi-lo);
      for(let i=0;i<n;i++){let v=(g[i]-lo)*255/r;v=v<0?0:v>255?255:v;d[i*4]=d[i*4+1]=d[i*4+2]=v;}}
    else{let sum=0;for(let v=0;v<256;v++)sum+=v*hist[v];let sB=0,wB=0,best=0,th=128;for(let v=0;v<256;v++){wB+=hist[v];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=v*hist[v];const mB=sB/wB,mF=(sum-sB)/wF,between=wB*wF*(mB-mF)*(mB-mF);if(between>best){best=between;th=v;}}
      for(let i=0;i<n;i++){const v=g[i]>th?255:0;d[i*4]=d[i*4+1]=d[i*4+2]=v;}}
    x.putImageData(im,0,0);}
  return c;
}
function drawScan(){
  const box=document.getElementById("scan-body");if(!box||!SCAN)return;
  box.innerHTML=SCAN.pages.length?`<div class="filters" style="margin-top:12px">${SCAN_MODES.map(([k,l])=>`<button class="chip" data-scan-mode="${k}" aria-pressed="${SCAN.mode===k}">${l}</button>`).join("")}</div>
    <div class="scan-grid">${SCAN.pages.map((p,i)=>`<div class="scan-pg"><b style="font-size:12px">Trang ${i+1}</b><div data-thumb="${i}"></div><div class="actions"><button class="btn sm" data-scan-act="left" data-i="${i}" aria-label="Xoay trái">⟲</button><button class="btn sm" data-scan-act="right" data-i="${i}" aria-label="Xoay phải">⟳</button><button class="btn sm" data-scan-act="up" data-i="${i}" aria-label="Lên">↑</button><button class="btn sm" data-scan-act="down" data-i="${i}" aria-label="Xuống">↓</button><button class="btn sm danger" data-scan-act="del" data-i="${i}" aria-label="Xóa trang">×</button></div></div>`).join("")}</div>
    <div class="actions" style="margin-top:14px"><button class="btn primary" data-scan-save>Lưu ${SCAN.pages.length} trang thành PDF</button></div>`:`<p class="muted" style="margin-top:12px">Chưa có trang nào.</p>`;
  SCAN.pages.forEach((p,i)=>{const el=box.querySelector(`[data-thumb="${i}"]`);if(el)el.appendChild(procCanvas(p,420,SCAN.mode));});
}
function scanAct(a,i){const P2=SCAN.pages;if(a==="left")P2[i].rot-=90;if(a==="right")P2[i].rot+=90;if(a==="del")P2.splice(i,1);if(a==="up"&&i>0)[P2[i-1],P2[i]]=[P2[i],P2[i-1]];if(a==="down"&&i<P2.length-1)[P2[i+1],P2[i]]=[P2[i],P2[i+1]];drawScan();}
async function addScanFiles(files){if(!SCAN)return;for(const f of files){try{const bmp=await createImageBitmap(f,{imageOrientation:"from-image"});SCAN.pages.push({bmp,rot:0});}catch(e){toast("Không đọc được ảnh "+f.name);}}drawScan();}
async function saveScan(btn){
  if(!SCAN||!SCAN.pages.length)return;btn.disabled=true;btn.textContent="Đang tạo PDF…";
  try{await loadScript(JSPDF_URL);const {jsPDF}=window.jspdf;let doc=null;
    for(const p of SCAN.pages){const c=procCanvas(p,1800,SCAN.mode);const land=c.width>c.height;const W2=land?297:210,H2=land?210:297,m=6;
      const k=Math.min((W2-2*m)/c.width,(H2-2*m)/c.height),w=c.width*k,h=c.height*k;
      if(!doc)doc=new jsPDF({unit:"mm",format:"a4",orientation:land?"landscape":"portrait",compress:true});else doc.addPage("a4",land?"landscape":"portrait");
      doc.addImage(c.toDataURL("image/jpeg",SCAN.mode==="bw"?0.7:0.82),"JPEG",(W2-w)/2,(H2-h)/2,w,h);}
    const blob=doc.output("blob");const key=SCAN.key;const parts=key.split("|");const b=blockById(parts[0]);
    const label=key.startsWith("hd|")?"HopDong_"+(contractById(parts[1])?.no||parts[1]):`${(DOC_NAMES[parts[2]]||parts[2]||"").replace(/\s+/g,"")}_${b?b.code:parts[0]}_${parts[1]==="sell"?"Ban":"Han"}`;
    const name=("Scan_"+label+"_"+today()).replace(/[\/\\:*?"<>|]+/g,"-")+".pdf";
    const old=FILE(key);const r=await ASSETS.upload(blob,{type:"application/pdf"});
    if(await write("files/"+sid(key),{key,assetId:r.id,name,size:r.sizeBytes,type:"application/pdf",date:today(),pages:SCAN.pages.length})){if(old?.assetId){try{await ASSETS.delete(old.assetId);}catch(e){}}closeModal();toast(`Đã lưu bản scan ${name}.`);}
    else{btn.disabled=false;btn.textContent="Lưu lại";}
  }catch(e){btn.disabled=false;btn.textContent="Thử lưu lại";toast(e?.code==="too_large"?"File quá 20 MB: bớt số trang hoặc chọn chế độ Đen trắng.":"Không tạo được PDF ("+(e?.code||e?.message||"lỗi")+").");}
}

  const al=t.closest("[data-add-line]");if(al){const b=cur(),k=al.dataset.addLine;b[k]=b[k]||[];b[k].push(k==="costs"?{name:"Khoản chi mới",amount:0,note:""}:{name:"Hạng mục mới",kg:null,price:null,amount:null});if(await saveBlock(b))render();return;}
  const dln=t.closest("[data-del-line]");if(dln){const b=cur(),k=dln.dataset.delLine;b[k].splice(+dln.dataset.i,1);if(await saveBlock(b))render();return;}
  if(t.closest("[data-del-block]")){state.confirm="del-block";return render();}
  if(t.closest("[data-confirm-cancel]")){state.confirm=null;return render();}
  if(t.closest("[data-del-block-yes]")){const b=cur();if(await remove("blocks/"+b.id)){S.blocks=S.blocks.filter(x=>x.id!==b.id);go("blocks");toast("Đã xóa Block.");}return;}
});
main.addEventListener("change",async e=>{
  const t=e.target,b=blockById(state.block);
  if(t.id==="doc-type"){state.docType=t.value;state.edit=false;return render();}
  if(t.id==="fit-mode"){state.fit=t.value;t.blur();return render();}
  if(t.id==="cost-block"){state.costBlock=t.value;return render();}
  if(t.dataset.bf&&b){const f=t.dataset.bf;b[f]=t.value===""&&f==="weldBy"?null:t.value;if(await saveBlock(b)){if(f==="status"){t.blur();render();toast(locked(b)?"Block đã quyết toán: thuế suất bị khóa. Danh sách hồ sơ cần lưu đã cập nhật.":"Đã đổi trạng thái.");}}return;}
  if(t.dataset.bfn&&b){b[t.dataset.bfn]=num(t.value);await saveBlock(b);return;}
  if(t.dataset.rate&&b&&!locked(b)){b.rates={...DEFAULT_RATES,...(b.rates||{}),[t.dataset.rate]:num(t.value)??0};await saveBlock(b);return;}
  if(t.dataset.line&&b){const k=t.dataset.line,i=+t.dataset.i,f=t.dataset.f;const row=b[k][i];row[f]=f==="name"||f==="note"?t.value:num(t.value);await saveBlock(b);return;}
  const rmap={"s-vat":"vat","s-tndn":"tndn","s-tncn":"tncn","s-adv":"advance"};
  if(rmap[t.id]){S.settings=S.settings||{company:{},defaults:{}};S.settings.defaults={...DEF_RATES(),[rmap[t.id]]:num(t.value)??0};if(await saveSettings())toast(`Đã đổi mặc định. ${S.blocks.length} Block hiện có giữ nguyên thuế suất đã chốt.`);return;}
  const cm={"s-name":"name","s-short":"short","s-mst":"mst","s-addr":"addr","s-rep":"rep","s-role":"role","s-phone":"phone","s-bank":"bank"};
  if(cm[t.id]){S.settings=S.settings||{company:{},defaults:{}};S.settings.company={...(S.settings.company||{}),[cm[t.id]]:t.value};if(await saveSettings())toast("Đã lưu thông tin công ty.");return;}
  const brm={"br-pos":["logoPos",v=>v],"br-h":["logoH",v=>+v],"br-wm":["wm",v=>v==="1"],"br-op":["wmOpacity",v=>+v]};
  if(brm[t.id]){const [k,f]=brm[t.id];await saveSettingsPart("branding",{...BR(),[k]:f(t.value)});return toast("Đã lưu cài đặt logo.");}
  if(/^th-(accent|rail|mark)$/.test(t.id)){const k=t.id.slice(3);const th={accent:THEMES[0][1],rail:THEMES[0][2],mark:THEMES[0][3],...(S.settings?.theme||{}),[k]:t.value};return saveTheme(th);}
  const nm={"n-gk":"gk","n-hd":"hd","n-file":"file"};
  if(nm[t.id]){S.settings=S.settings||{company:{},defaults:{}};S.settings.numbering={...(S.settings.numbering||{}),[nm[t.id]]:t.value};await saveSettings();return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("modal-root").innerHTML)closeModal();});

/* ============ Khởi động & đồng bộ ============ */
function subscribe(name,ref,apply){
  ref.onSnapshot(snap=>{apply(snap);loaded.add(name);setSync();requestRender();},err=>{loaded.add(name);if(err?.code==="revoked")FATAL="Quyền truy cập trang đã thay đổi. Hãy tải lại trang.";else toast("Mất kết nối dữ liệu ("+(err?.code||"lỗi")+"). Tải lại trang để kết nối lại.");requestRender();});
}
function setSync(){const el=document.getElementById("sync");if(el)el.innerHTML=loaded.size<NEED.length?"Đang kết nối…":`<b>●</b> Đã đồng bộ ${new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}${RO?" · chỉ xem":""}`;}
(async()=>{
  render();
  const c=window.claude;
  if(!c||!c.use){FATAL="Trang này cần mở trong Claude (đã đăng nhập) để đọc và lưu dữ liệu.";return render();}
  [DB,USER,ASSETS,DL]=await Promise.all([c.use("db"),c.use("user"),c.use("assets"),c.use("downloads")]);
  if(!DB){FATAL="Không kết nối được kho dữ liệu. Hãy đăng nhập Claude rồi mở lại trang.";return render();}
  try{const w=USER?await USER.can("data.write"):null;if(w===false)RO=true;}catch(e){}
  const docs=snap=>snap.docs.map(d=>({...clone(d.data()),id:d.data().id||d.id}));
  subscribe("settings",DB.doc("app/settings"),s=>{S.settings=s.exists?clone(s.data()):null;applyTheme();});
  subscribe("blocks",DB.collection("blocks"),s=>{S.blocks=docs(s);});
  subscribe("partners",DB.collection("partners"),s=>{S.partners=docs(s);});
  subscribe("contracts",DB.collection("contracts"),s=>{S.contracts=docs(s);});
  subscribe("prices",DB.collection("prices"),s=>{S.prices=docs(s);});
  subscribe("templates",DB.collection("templates"),s=>{S.templates={};s.docs.forEach(d=>{const v=d.data();if(v.key)S.templates[v.key]=clone(v);});});
  subscribe("files",DB.collection("files"),s=>{S.files={};s.docs.forEach(d=>{const v=d.data();if(v.key)S.files[v.key]=clone(v);});});
  subscribe("taxpay",DB.collection("taxpay"),s=>{S.taxpay=docs(s);});
  setTimeout(()=>{if(loaded.size<NEED.length){NEED.forEach(n=>loaded.add(n));requestRender();}},12000);
})();
const start=(location.hash||"").slice(1);
if(V[start])state.view=start;
renderNav();
