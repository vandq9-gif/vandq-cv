<body data-page="contact" data-root="">
<header id="site-header"></header>
<section class="page-hero" style="padding:0">
  <div class="container">
    <div class="crumb"><a href="index.html">Trang chủ</a> / Liên hệ</div>
    <h1>Kết nối với tôi</h1>
    <p>Cơ hội công việc, hợp tác dự án hay chỉ đơn giản là muốn trò chuyện – cứ nhắn cho tôi.</p>
    
  </div>
</section>
<section>
  <div class="container contact-grid">
    <ul class="contact-list reveal" id="contact-list"></ul>
    <form class="card reveal" id="contact-form">
      <div class="field"><label for="f-name">Họ và tên</label><input id="f-name" name="ho-ten" required autocomplete="name"></div>
      <div class="field"><label for="f-contact">Số điện thoại hoặc email của bạn</label><input id="f-contact" name="lien-lac" required></div>
      <div class="field"><label for="f-topic">Bạn cần trao đổi về</label><select id="f-topic" name="chu-de"><option>Cơ hội công việc</option><option>Hợp tác gia công block tàu</option><option>Góp ý bài viết, video</option><option>Khác</option></select></div>
      <div class="field"><label for="f-msg">Nội dung</label><textarea id="f-msg" name="noi-dung" rows="5" required></textarea></div>
      <div class="hero-actions" style="margin-top:4px">
        <button class="btn btn-dark" type="submit">✉️ Gửi qua Email</button>
        <a class="btn btn-line" id="zalo-btn" target="_blank" rel="noopener">💬 Nhắn Zalo</a>
      </div>
      <p class="form-note">Bấm “Gửi qua Email” để mở ứng dụng email với nội dung đã điền sẵn, hoặc nhắn trực tiếp qua Zalo.</p>
    </form>
  </div>
</section>
