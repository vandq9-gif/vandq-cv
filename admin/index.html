<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị website – vandq.id.vn</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#121418;--muted:#5f6570;--line:#e3e1dc;--bg:#f4f3f0;--paper:#fff;--accent:#10b981;--accent-ink:#047857;--soft:#dcfce9;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{font:14px/1.5 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff;flex-shrink:0}
.top .logo{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.top .logo span{background:var(--accent);color:#04140d;border-radius:8px;padding:2px 8px;font-size:12px}
.top .sp{flex:1}
.top a{color:#cfd3da;text-decoration:none;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#bdb9b1}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04140d}
.btn.pri:hover{background:#34d399}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top .btn{border-color:#3a3f49;background:#1f232a;color:#fff}
.top .btn.pri{background:var(--accent);color:#04140d;border-color:var(--accent)}
.badge{background:#f59e0b;color:#111;border-radius:999px;padding:0 7px;font-size:12px;font-weight:800}
.wrap{flex:1;display:flex;min-height:0}
nav.side{width:210px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
nav.side button{display:flex;width:100%;align-items:center;gap:9px;text-align:left;border:0;background:none;padding:9px 11px;border-radius:10px;font-weight:600;color:var(--muted)}
nav.side button:hover{background:#f1efeb;color:var(--ink)}
nav.side button.on{background:var(--ink);color:#fff}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9aa0a8;margin:14px 11px 4px;font-weight:700}
main{flex:1;overflow:auto;min-width:0}
.pane{padding:22px 26px;max-width:1100px}
.pane h1{font-size:22px;font-weight:800;margin-bottom:4px}
.pane .sub{color:var(--muted);margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px}
.field{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:start;padding:7px 0;border-top:1px dashed #eeece8}
.field:first-child{border-top:0}
.field>label{font-weight:600;color:#3b4049;padding-top:7px;font-size:13px}
.field>label small{display:block;color:#9aa0a8;font-weight:500;font-size:11px}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imgf{display:flex;gap:10px;align-items:center}
.imgf img{width:64px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f3f2ef;flex-shrink:0}
.imgf input{flex:1}
.item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fcfcfb}
.item>.ih{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-weight:700}
.item>.ih .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>.ib{padding:4px 14px 12px;display:none;border-top:1px solid var(--line)}
.item.open>.ib{display:block}
.nested{border-left:3px solid #eceae5;padding-left:12px}
.note{background:var(--warn-soft);color:#713f12;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.ok{background:var(--soft);color:#064e3b;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.err{background:var(--bad-soft);color:#7f1d1d;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;display:flex;gap:8px}
ol.steps{padding-left:20px}ol.steps li{margin:6px 0}
code{background:#f1efeb;border-radius:5px;padding:1px 5px;font-size:12.5px}
/* trình sửa trang */
.ed{display:flex;flex-direction:column;height:100%}
.edbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.edbar select{width:auto;max-width:240px}
.edbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tb{gap:3px}.tb button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:30px;height:30px;padding:0 6px;font-weight:700;font-size:13px}
.tb button:hover{background:#f1efeb}
.edbody{flex:1;display:flex;min-height:0}
.edframe{flex:1;display:flex;justify-content:center;background:#d9d7d2;overflow:hidden;padding:10px}
.edframe iframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.12);transition:width .2s}
.edside{width:300px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:14px}
.edside h4{font-size:13px;margin:14px 0 6px}
.edside h4:first-child{margin-top:0}
.edside .lab{font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.grid-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid-img .g{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;font-size:11px}
.grid-img .g img{width:100%;height:100px;object-fit:cover;background:#f3f2ef;display:block}
.grid-img .g div{padding:6px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.5);display:grid;place-items:center;z-index:90}
.modal .box{background:#fff;border-radius:16px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto}
.modal h3{margin-bottom:10px}
.chk{display:flex;gap:8px;align-items:center}
.pendlist{font-size:12.5px;margin:8px 0 12px;max-height:220px;overflow:auto;background:#f7f6f3;border-radius:10px;padding:8px 12px}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:42px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
@media(max-width:900px){nav.side{width:64px}nav.side button span.tx,nav.side .grp{display:none}.field{grid-template-columns:1fr}.edside{display:none}.edside.show{display:block;position:fixed;right:0;top:50px;bottom:0;z-index:50;box-shadow:-10px 0 30px rgba(0,0,0,.15)}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">⚙️ Quản trị website <span>vandq.id.vn</span></div>
  <div class="sp"></div>
  <a href="../index.html" target="_blank" rel="noopener">↗ Xem website</a>
  <button class="btn" id="btn-discard" title="Bỏ mọi thay đổi chưa xuất bản">↺ Bỏ thay đổi</button>

    <div class="grp">Bắt đầu</div>

<input type="file" id="file-pick" accept="image/*" hidden>

<script>
(function(){
"use strict";
/* ================= Cấu hình ================= */
const REPO = "vandq9-gif/vandq-cv", BRANCH = "main", API = "https://api.github.com";
const SITE_URL = location.origin + location.pathname.replace(/admin\/.*$/, "");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
function toast(msg, ms = 2600) { const t = h(`<div class="toast">${esc(msg)}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const token = () => localStorage.getItem("adm_token") || "";

/* ================= GitHub ================= */
async function gh(path, opt = {}) {
  const headers = { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (opt.body) headers["Content-Type"] = "application/json";
  const r = await fetch(API + path, { ...opt, headers, cache: "no-store" });
  if (!r.ok) { let m = ""; try { m = (await r.json()).message; } catch (e) {} throw new Error(`GitHub ${r.status}: ${m || r.statusText}`); }
  return r.status === 204 ? null : r.json();
}
const b64ToText = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), c => c.charCodeAt(0)));
const textToB64 = t => { const u = new TextEncoder().encode(t); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
let TREE = null;
async function loadTree(force) {
  if (TREE && !force) return TREE;
  const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`);
  const t = await gh(`/repos/${REPO}/git/trees/${ref.object.sha}?recursive=1`);
  TREE = t.tree.filter(x => x.type === "blob");
  return TREE;
}
const ORIG = {};
async function readText(path) {
  if (PEND[path] && PEND[path].text != null) return PEND[path].text;
  if (ORIG[path] != null) return ORIG[path];
  const tree = await loadTree();
  const ent = tree.find(x => x.path === path);
  if (!ent) throw new Error("Không thấy tệp " + path);
  const b = await gh(`/repos/${REPO}/git/blobs/${ent.sha}`);
  return (ORIG[path] = b64ToText(b.content));
}

/* ================= Thay đổi chờ xuất bản ================= */
const PEND = {};            // path -> {text} | {b64, preview} | {del:true}
const PEND_LABEL = {};
function stage(path, data, label) { PEND[path] = data; PEND_LABEL[path] = label || path; updPend(); }
function updPend() { const n = Object.keys(PEND).length; $("#pend-count").textContent = n; $("#btn-publish").disabled = !n; }
addEventListener("beforeunload", e => { if (Object.keys(PEND).length) { e.preventDefault(); e.returnValue = ""; } });
$("#btn-discard").onclick = () => {
  if (!Object.keys(PEND).length) return toast("Chưa có thay đổi nào.");
  if (!confirm("Bỏ toàn bộ thay đổi chưa xuất bản?")) return;
  for (const k in PEND) delete PEND[k]; updPend(); show(CUR, true); toast("Đã bỏ thay đổi.");
};
$("#btn-publish").onclick = openPublish;

function openPublish() {
  const keys = Object.keys(PEND);
  if (!keys.length) return toast("Chưa có thay đổi nào.");
  if (!token()) { show("connect"); return toast("Cần kết nối GitHub trước."); }
  const touchesAssets = keys.some(k => /\.(js|css)$/.test(k));
  const m = h(`<div class="modal"><div class="box"><h3>🚀 Xuất bản lên website</h3>
    <p class="hint">Các thay đổi sau sẽ được lưu lên GitHub, website cập nhật sau khoảng 1 phút.</p>
    <div class="pendlist">${keys.map(k => `<div>${PEND[k].del ? "🗑️" : PEND[k].b64 ? "🖼️" : "📄"} ${esc(PEND_LABEL[k])} <span class="hint">(${esc(k)})</span></div>`).join("")}</div>
    <div class="lab hint">Ghi chú (không bắt buộc)</div><input type="text" id="pub-msg" placeholder="Ví dụ: Sửa lời giới thiệu trang chủ">
    <label class="chk" style="margin-top:10px"><input type="checkbox" id="pub-bump" ${touchesAssets ? "checked" : ""}> Buộc trình duyệt người xem tải bản mới (nên bật khi sửa thông tin, menu, màu)</label>
    <div id="pub-st" style="margin-top:12px"></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-x>Đóng</button><button class="btn pri" data-go>Xuất bản ngay</button></div></div></div>`);
  document.body.appendChild(m);
  $("[data-x]", m).onclick = () => m.remove();
  $("[data-go]", m).onclick = async () => {
    const st = $("#pub-st", m), go = $("[data-go]", m); go.disabled = true;
    try { await publish($("#pub-msg", m).value.trim(), $("#pub-bump", m).checked, s => st.innerHTML = `<div class="note">${esc(s)}</div>`);
      st.innerHTML = `<div class="ok">✅ Đã xuất bản! Website sẽ cập nhật sau khoảng 1 phút. <a href="${SITE_URL}" target="_blank">Mở website</a></div>`;
      go.textContent = "Xong"; go.onclick = () => m.remove(); go.disabled = false;
    } catch (e) { st.innerHTML = `<div class="err">❌ ${esc(e.message)}</div>`; go.disabled = false; }
  };
}
async function publish(msg, bump, say) {
  say("Đang đọc bản hiện tại trên GitHub…");
  const ref = await gh(`/repos/${REPO}/git/ref/heads/${BRANCH}`);
  const base = ref.object.sha;
  const bc = await gh(`/repos/${REPO}/git/commits/${base}`);
  const files = {}; for (const k in PEND) files[k] = PEND[k];
  if (bump) {
    say("Đang cập nhật mã phiên bản cho các trang…");
    const v = new Date().toISOString().replace(/\D/g, "").slice(0, 12);
    const tree = await loadTree(true);
    const htmls = tree.filter(x => /\.html$/.test(x.path) && !/^(du-an\/|admin\/)/.test(x.path)).map(x => x.path);
    Object.keys(files).forEach(k => { if (/\.html$/.test(k) && !/^(du-an\/|admin\/)/.test(k) && !htmls.includes(k)) htmls.push(k); });
    for (const p of htmls) {
      if (files[p] && files[p].del) continue;
      let t = files[p] && files[p].text != null ? files[p].text : await readText(p);
      const n = t.replace(/(\.(?:css|js))\?v=\d+/g, `$1?v=${v}`);
      if (n !== t) files[p] = { text: n };
    }
  }
  const tree = []; let i = 0; const keys = Object.keys(files);
  for (const p of keys) {
    i++; say(`Đang tải lên ${i}/${keys.length}: ${p}`);
    const f = files[p];
    if (f.del) { tree.push({ path: p, mode: "100644", type: "blob", sha: null }); continue; }
    const blob = await gh(`/repos/${REPO}/git/blobs`, { method: "POST", body: JSON.stringify(f.b64 ? { content: f.b64, encoding: "base64" } : { content: f.text, encoding: "utf-8" }) });
    tree.push({ path: p, mode: "100644", type: "blob", sha: blob.sha });
  }
  say("Đang tạo bản lưu…");
  const nt = await gh(`/repos/${REPO}/git/trees`, { method: "POST", body: JSON.stringify({ base_tree: bc.tree.sha, tree }) });
  const labels = Object.keys(PEND).map(k => PEND_LABEL[k]).filter((v, i, a) => a.indexOf(v) === i);
  const message = (msg || "Sửa website qua trang quản trị") + "\n\n" + labels.map(l => "- " + l).join("\n");
  const c = await gh(`/repos/${REPO}/git/commits`, { method: "POST", body: JSON.stringify({ message, tree: nt.sha, parents: [base] }) });
  await gh(`/repos/${REPO}/git/refs/heads/${BRANCH}`, { method: "PATCH", body: JSON.stringify({ sha: c.sha }) });
  for (const k in files) { if (files[k].text != null) ORIG[k] = files[k].text; else delete ORIG[k]; }
  for (const k in PEND) delete PEND[k];
  TREE = null; updPend();
}

/* ================= Ảnh ================= */
const PREVIEW = {};   // đường dẫn trong repo -> blob URL để xem trước khi chưa xuất bản
function pickFile(accept = "image/*") {
  return new Promise(res => { const f = $("#file-pick"); f.accept = accept; f.value = ""; f.onchange = () => res(f.files[0] || null); f.click(); });
}
const slugify = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80);
async function fileToB64(file, maxW = 1800) {
  const isSvg = /svg/.test(file.type), isGif = /gif/.test(file.type);
  if (isSvg || isGif || (file.size < 350000 && !/heic/i.test(file.type))) {
    const buf = new Uint8Array(await file.arrayBuffer()); let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return { b64: btoa(s), ext: (file.name.split(".").pop() || "png").toLowerCase(), blob: file };
  }
  const img = await createImageBitmap(file);
  const sc = Math.min(1, maxW / img.width), c = document.createElement("canvas");
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  const keepPng = /png/.test(file.type);
  const ctx = c.getContext("2d"); if (!keepPng) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, keepPng ? "image/png" : "image/jpeg", .85));
  const buf = new Uint8Array(await blob.arrayBuffer()); let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return { b64: btoa(s), ext: keepPng ? "png" : "jpg", blob };
}
/* Tải ảnh lên: trả về đường dẫn trong repo, ví dụ images/uploads/2026...-anh.jpg */
async function uploadImage(folder = "images/uploads", fixedPath) {
  const file = await pickFile(); if (!file) return null;
  const r = await fileToB64(file);
  const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "anh";
  const stamp = new Date().toISOString().replace(/\D/g, "").slice(2, 12);
  const path = fixedPath || `${folder}/${stamp}-${base}.${r.ext}`;
  stage(path, { b64: r.b64 }, "Ảnh: " + path.split("/").pop());
  PREVIEW[path] = URL.createObjectURL(r.blob);
  toast("Đã thêm ảnh – nhớ bấm Xuất bản.");
  return path;
}
const imgUrl = p => !p ? "" : /^(https?:|data:|blob:)/.test(p) ? p : (PREVIEW[p] || SITE_URL + p.replace(/^\.?\//, ""));

/* ================= Tệp dữ liệu JS (const X = …) ================= */
const DATA_FILES = {
  "js/profile.js": { names: ["PROFILE", "SOCIAL", "SITE"], head: { PROFILE: "/* ====== THÔNG TIN CÁ NHÂN – sửa trong /admin ====== */", SOCIAL: "/* Mạng xã hội – điền link là web tự hiện khung nhúng */", SITE: "/* Menu, chữ trên đầu trang và chân trang – sửa trong /admin */" } },
  "js/posts.js": { names: ["POSTS"], head: { POSTS: "/* Danh sách bài viết */" } },

const hexRand = n => [...crypto.getRandomValues(new Uint8Array(n))].map(x => x.toString(16).padStart(2, "0")).join("");
const randPass = () => { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; crypto.getRandomValues(new Uint8Array(8)).forEach(x => s += a[x % a.length]); return s.slice(0, 4) + "-" + s.slice(4); };
const sha256 = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, "0")).join("");
const todayISO = (add = 0) => { const d = new Date(Date.now() + add * 864e5); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

const fmtD = d => { const [y, m, dd] = String(d).split("-"); return `${dd}/${m}/${y}`; };
async function syncPostPage(it) {
  const path = `bai-viet/${it.slug}.html`;
  const src = await readText(path);
  const doc = new DOMParser().parseFromString(src, "text/html");
  const full = `${it.title} – Đinh Quý Văn`;
  doc.title = full;
  const setM = (sel, v) => { const e = doc.querySelector(sel); if (e) e.setAttribute("content", v); };
  setM('meta[name="description"]', it.desc); setM('meta[property="og:title"]', full); setM('meta[property="og:description"]', it.desc);
  const h1 = doc.querySelector(".page-hero h1"); if (h1) h1.textContent = it.title;
  const pl = doc.querySelector(".page-hero .container > p"); if (pl) pl.textContent = `${fmtD(it.date)} · ${it.read} phút đọc · Đinh Quý Văn`;
  const cr = doc.querySelector(".page-hero .crumb"); if (cr && cr.lastChild && cr.lastChild.nodeType === 3) cr.lastChild.textContent = " / " + it.cat;
  stage(path, { text: serialize(doc) }, "Bài: " + it.title);
}
function serialize(doc) { return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML.replace(/<\/body>\s*<\/html>\s*$/, "</body>\n</html>\n"); }

  side.innerHTML = `<h4>Cách sửa</h4><p class="hint">• Bấm vào chữ có viền xanh để sửa.<br>• Bấm vào ảnh để thay ảnh.<br>• Rê chuột lên một khối để đổi thứ tự, ẩn, nhân bản, thêm, xóa.<br>• Danh sách bài viết, video, dự án, tên, số điện thoại… sửa ở các mục bên trái.<br>• Xong bấm <b>💾 Lưu thay đổi</b> (hoặc Ctrl+S).</p>
    <h4>Thông tin trang (Google, Facebook)</h4>
    <div class="lab">Tiêu đề trang</div><input type="text" id="ps-t">
    <div class="lab">Mô tả</div><textarea id="ps-d" rows="4"></textarea>
    <p class="hint" style="margin-top:6px">Với bài viết, nên sửa tiêu đề ở mục <b>Bài viết</b> để đồng bộ cả danh sách.</p>`;
  $("#ps-t", side).value = S.title; $("#ps-d", side).value = desc ? desc.getAttribute("content") : "";
  $("#ps-t", side).oninput = e => { S.title = e.target.value; const o = S.querySelector('meta[property="og:title"]'); if (o) o.setAttribute("content", e.target.value); EDITOR.dirty = true; };
  $("#ps-d", side).oninput = e => { ["meta[name=\"description\"]", "meta[property=\"og:description\"]"].forEach(q => { const o = S.querySelector(q); if (o) o.setAttribute("content", e.target.value); }); EDITOR.dirty = true; };
}
function linkPanel(fa) {
  EDITOR.curLink = fa;
  const side = $("#edside"); const inHost = fa.closest("[data-ed]");
  side.innerHTML = `<h4>🔗 Liên kết</h4><div class="lab">Chữ</div><div class="hint">${esc(fa.textContent.trim().slice(0, 80))}</div>
    <div class="lab">Dẫn tới</div><input type="text" id="lk" placeholder="ví dụ: lien-he.html hoặc https://…">
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="lk-n"> Mở trong tab mới</label>
    <div class="row" style="margin-top:10px"><button class="btn pri sm" id="lk-ok">Áp dụng</button><button class="btn sm" id="lk-x">Đóng</button></div>
    <p class="hint" style="margin-top:8px">Link trong trang dùng đường dẫn như <code>${esc(EDITOR.S.body.dataset.root || "")}ho-so.html</code>.</p>`;
  $("#lk", side).value = fa.getAttribute("href") || ""; $("#lk-n", side).checked = fa.target === "_blank";
  $("#lk-x", side).onclick = renderSide;
  $("#lk-ok", side).onclick = () => {
    const v = $("#lk", side).value.trim(), nb = $("#lk-n", side).checked;
    const apply = a => { a.setAttribute("href", v); if (nb) { a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener"); } else { a.removeAttribute("target"); a.removeAttribute("rel"); } };
    apply(fa);
    if (fa.hasAttribute("data-a") && !(inHost && inHost !== fa)) { const s = EDITOR.S.querySelector(`[data-a="${fa.dataset.a}"]`); if (s) apply(s); }
    EDITOR.dirty = true; toast("Đã đổi liên kết.");
  };
}
function imagePanel(fi) {
  const side = $("#edside"); const id = fi.dataset.im; const [si] = id != null ? pair("data-im", id) : [null];
  const inRich = fi.closest("[data-rich]");
  side.innerHTML = `<h4>🖼️ Ảnh</h4><img src="${esc(fi.src)}" style="width:100%;border-radius:10px;border:1px solid #e3e1dc">
    <div class="lab">Đường dẫn</div><input type="text" id="im-p">
    <div class="lab">Mô tả ảnh (alt)</div><input type="text" id="im-a">
    <div class="row" style="margin-top:10px"><button class="btn pri sm" id="im-up">⬆ Thay ảnh khác</button><button class="btn sm" id="im-ok">Áp dụng</button></div>
    <div class="row" style="margin-top:8px"><button class="btn sm bad" id="im-rm">Xóa ảnh này</button><button class="btn sm" id="im-x">Đóng</button></div>`;
  const root = EDITOR.S.body.dataset.root || "";
  $("#im-p", side).value = si ? si.getAttribute("src") : fi.getAttribute("src"); $("#im-a", side).value = fi.getAttribute("alt") || "";
  const apply = (src, preview) => {
    fi.setAttribute("src", preview || src);
    fi.setAttribute("alt", $("#im-a", side).value);
    if (si && !inRich) { si.setAttribute("src", src); si.setAttribute("alt", $("#im-a", side).value); fi.removeAttribute("srcset"); si.removeAttribute("srcset"); }
    EDITOR.dirty = true; $("img", side).src = fi.src;
  };
  $("#im-up", side).onclick = async () => { const p = await uploadImage(); if (p) { $("#im-p", side).value = root + p; apply(root + p, PREVIEW[p]); } };
  $("#im-ok", side).onclick = () => apply($("#im-p", side).value.trim());
  $("#im-rm", side).onclick = () => { if (!confirm("Xóa ảnh khỏi trang?")) return; if (inRich) { const fig = fi.closest("figure"); (fig && inRich.contains(fig) ? fig : fi).remove(); } else { fi.remove(); if (si) si.remove(); } EDITOR.dirty = true; renderSide(); };
  $("#im-x", side).onclick = renderSide;
}
function wireToolbar(ed) {
  const F = () => EDITOR.F;
  $$("#tb button", ed).forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = async () => {
      const d = F(); if (!d) return;
      if (b.dataset.c && !/List$/.test(b.dataset.c)) d.execCommand(b.dataset.c, false, null);
      if (b.dataset.b || /List$/.test(b.dataset.c || "")) {
        const sl = d.getSelection(), nd = sl.rangeCount && sl.anchorNode, hs = nd && (nd.nodeType === 1 ? nd : nd.parentElement).closest("[data-rich]");
        if (!hs) return toast("Tiêu đề, danh sách, trích dẫn chỉ dùng trong thân bài viết. Chữ ở chỗ khác chỉ cần sửa trực tiếp.");
        if (b.dataset.b) d.execCommand("formatBlock", false, b.dataset.b); else d.execCommand(b.dataset.c, false, null);
      }
      if (b.dataset.k === "link") { const u = prompt("Dán đường link:", "https://"); if (u) { d.execCommand("createLink", false, u); } }
      if (b.dataset.k === "img") {
        const sel = d.getSelection(); const node = sel.rangeCount && sel.anchorNode; const host = node && (node.nodeType === 1 ? node : node.parentElement).closest("[data-rich]");
        if (!host) return toast("Đặt con trỏ vào thân bài viết (vùng văn bản) trước khi chèn ảnh.");
        const range = sel.getRangeAt(0).cloneRange();
        const p = await uploadImage(); if (!p) return;
        const cap = prompt("Chú thích ảnh (có thể để trống):", "") || "";
        sel.removeAllRanges(); sel.addRange(range);
        d.execCommand("insertHTML", false, `<figure><img src="${PREVIEW[p]}" alt="${esc(cap)}" loading="lazy">${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}</figure><p><br></p>`);
      }
      EDITOR.dirty = true;
    };
  });
}

/* ================= Khởi động ================= */
updPend();
const start = (location.hash || "").slice(1);
show(TABS[start] ? start : (token() ? "pages" : "connect"));
})();
</script>
